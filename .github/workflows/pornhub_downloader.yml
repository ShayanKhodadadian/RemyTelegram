name: p

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of video"
        required: true
        type: string

      output_folder:
        description: "Output folder"
        required: false
        type: string
        default: "downloads"

      quality:
        description: "yt-dlp format selector"
        required: false
        type: string
        default: "bestvideo[height<=720]+bestaudio/best[ext=mp4]/best"

      archive_name:
        description: "RAR archive name"
        required: false
        type: string
        default: "video"

permissions:
  contents: write

jobs:
  download-and-split:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            bc \
            rar \
            unzip

          echo "Versions:"
          yt-dlp --version
          ffmpeg -version
          node --version

      - name: Create cookies file
        shell: bash
        run: |
          set -e

          if [ -n "${{ secrets.YTDLP_COOKIES }}" ]; then
              echo "${{ secrets.YTDLP_COOKIES }}" > cookies.txt
              echo "Cookies loaded"
          else
              echo "No cookies secret found"
              touch cookies.txt
          fi

      - name: Download video
        id: download
        shell: bash
        run: |
          set -euo pipefail

          FOLDER="${{ github.event.inputs.output_folder }}"
          URL="${{ github.event.inputs.url }}"
          QUALITY="${{ github.event.inputs.quality }}"

          mkdir -p "$FOLDER"

          OUTPUT_FILE="${RUNNER_TEMP}/download_result.txt"

          SUCCESS=false
          MAX_RETRIES=5

          for ((i=1;i<=MAX_RETRIES;i++))
          do

            echo "=================================="
            echo "Attempt $i / $MAX_RETRIES"
            echo "=================================="

            rm -f "$OUTPUT_FILE"

            if yt-dlp \
              -v \
              --cookies cookies.txt \
              --newline \
              --no-color \
              --retries 10 \
              --fragment-retries 10 \
              --extractor-retries 5 \
              --merge-output-format mp4 \
              --geo-bypass \
              --format "$QUALITY" \
              --output "./$FOLDER/%(uploader)s - %(title)s - %(id)s.%(ext)s" \
              --print after_move:filepath \
              "$URL" > "$OUTPUT_FILE"
            then

              NEW_FILE=$(tail -n 1 "$OUTPUT_FILE" | tr -d '\r')

              echo "Found file:"
              echo "$NEW_FILE"

              if [[ -f "$NEW_FILE" ]]; then
                  SUCCESS=true
                  break
              fi
            fi

            echo "Attempt failed"

            sleep 5

          done

          if [[ "$SUCCESS" != true ]]; then
            echo "Download failed after retries"
            exit 1
          fi

          FILE_NAME=$(basename "$NEW_FILE")
          FILE_SIZE=$(stat -c%s "$NEW_FILE")

          echo "filename=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "filepath=$NEW_FILE" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$FILE_SIZE" >> "$GITHUB_OUTPUT"

          ls -lh "$NEW_FILE"

      - name: Split file if larger than 99MB
        id: split
        shell: bash
        run: |
          set -euo pipefail

          FOLDER="${{ github.event.inputs.output_folder }}"
          FILE="${{ steps.download.outputs.filename }}"
          SIZE="${{ steps.download.outputs.size_bytes }}"

          THRESHOLD=103809024

          cd "$FOLDER"

          if [[ "$SIZE" -gt "$THRESHOLD" ]]
          then

              RANDOM_ID=$(openssl rand -hex 3)

              ARCHIVE="${{ github.event.inputs.archive_name }}_${RANDOM_ID}"

              rar a \
                -v95m \
                -m5 \
                -ep1 \
                "${ARCHIVE}.rar" \
                "$FILE"

              rm -f "$FILE"

              echo "split_done=true" >> "$GITHUB_OUTPUT"

              echo "Archive parts:"
              ls -lh

          else

              echo "split_done=false" >> "$GITHUB_OUTPUT"

          fi

      - name: Commit and push
        shell: bash
        run: |
          set -e

          FOLDER="${{ github.event.inputs.output_folder }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$FOLDER"

          if ! git diff --cached --quiet
          then
            git commit -m "Add downloaded files"
            git push
          else
            echo "Nothing to commit"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f cookies.txt