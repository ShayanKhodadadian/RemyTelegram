name: Telegram Channel Export (Debug)

on:
  workflow_dispatch:
    inputs:
      channel_name:
        description: 'آدرس کانال (بدون @) مثلاً DeutschMahroo'
        required: true
        default: 'DeutschMahroo'
      message_count:
        description: 'تعداد پیام‌های اخیر برای دریافت'
        required: true
        default: '20'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Telegram scraper (with debug logs)
        env:
          CHANNEL: ${{ github.event.inputs.channel_name }}
          COUNT: ${{ github.event.inputs.message_count }}
        run: |
          python << 'PYEOF'
          import os, requests, time, json, datetime
          from bs4 import BeautifulSoup

          channel = os.environ['CHANNEL']
          count = int(os.environ['COUNT'])
          base_url = f'https://t.me/s/{channel}'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          }

          messages = []
          current_url = base_url

          print(f"🎯 Trying to fetch {count} messages from @{channel}")
          print(f"🌐 Starting URL: {current_url}\n")

          while len(messages) < count:
              resp = requests.get(current_url, headers=headers, timeout=15)
              print(f"📡 Request to: {current_url}")
              print(f"   Status Code: {resp.status_code}")

              if resp.status_code != 200:
                  print(f"   ❌ Failed! Response content (first 200 chars): {resp.text[:200]}")
                  break

              # نمایش بخشی از کد HTML برای عیب‌یابی
              print(f"   📄 Page size: {len(resp.text)} chars")
              # فقط 300 کاراکتر اول
              snippet = resp.text[:300].replace('\n', ' ')
              print(f"   📝 HTML snippet: {snippet} ...")

              soup = BeautifulSoup(resp.text, 'html.parser')

              # روش مقاوم‌تر: پیدا کردن هر div که data-post شبیه channel/123 دارد
              msg_containers = soup.select('.tgme_widget_message_wrap')
              fallback_containers = soup.select('div[data-post]')
              
              # اگر با کلاس اصلی چیزی پیدا نشد، از روش fallback استفاده کن
              if not msg_containers and fallback_containers:
                  print("   ⚠️ Standard class not found, using generic data-post selector.")
                  # فیلتر آنهایی که حاوی "/" هستند
                  msg_containers = [div for div in fallback_containers if '/' in div.get('data-post', '')]
              
              print(f"   📦 Found {len(msg_containers)} potential message containers")

              if not msg_containers:
                  print("   ❌ No message containers found. Stopping.")
                  break

              for container in msg_containers:
                  if len(messages) >= count:
                      break

                  msg_id_raw = container.get('data-post', '')
                  if not msg_id_raw or '/' not in msg_id_raw:
                      continue
                  msg_id_num = msg_id_raw.split('/')[-1]

                  # متن پیام
                  text_div = container.select_one('.tgme_widget_message_text')
                  text = text_div.get_text(strip=True) if text_div else ""

                  # فایل پیوست (مانند PDF)
                  file_info = None
                  doc_wrap = container.select_one('.tgme_widget_message_document_wrap')
                  if doc_wrap:
                      # برخی نسخه‌ها لینک مستقیم داخل doc_wrap است، برخی دیگر در یک <a> کناری
                      file_link = doc_wrap.get('href')
                      if not file_link:
                          # شاید لینک داخل یک تگ a باشد
                          a_tag = doc_wrap.find('a')
                          if a_tag:
                              file_link = a_tag.get('href')
                      title_el = container.select_one('.tgme_widget_message_document_title')
                      file_name = title_el.get_text(strip=True) if title_el else "unknown_file"
                      file_info = {
                          "file_name": file_name,
                          "download_link": file_link or "not found"
                      }

                  # لینک خود پیام
                  message_link = f"https://t.me/{channel}/{msg_id_num}"

                  messages.append({
                      "message_id": int(msg_id_num),
                      "text": text,
                      "file": file_info,
                      "message_link": message_link
                  })

              # رفتن به صفحه‌ی قدیمی‌تر
              if msg_containers:
                  last_msg = msg_containers[-1]
                  last_id = last_msg.get('data-post', '').split('/')[-1]
                  if last_id:
                      current_url = f"{base_url}?before={last_id}"
                  else:
                      break
              else:
                  break

              time.sleep(1.5)  # کمی بیشتر برای احتیاط

          messages = messages[:count]
          print(f"\n✅ Total messages collected: {len(messages)}")

          # ساختن پوشه و فایل خروجی
          out_dir = "Telegram Export"
          os.makedirs(out_dir, exist_ok=True)

          timestamp = datetime.datetime.now().strftime("%Y-%m-%d_%H-%M-%S")
          filename = f"export_{timestamp}.json"
          filepath = os.path.join(out_dir, filename)

          with open(filepath, 'w', encoding='utf-8') as f:
              json.dump(messages, f, ensure_ascii=False, indent=2)

          print(f"📁 Saved to {filepath}")

          # اگر پیام‌ها خالی هستند، فایل لاگ جداگانه‌ای هم ذخیره کن
          if not messages:
              debug_file = os.path.join(out_dir, "debug_empty_response.txt")
              with open(debug_file, 'w', encoding='utf-8') as dbg:
                  dbg.write(f"URL: {base_url}\nResponse status: {resp.status_code}\n")
                  dbg.write(f"Response text (first 1000 chars):\n{resp.text[:1000]}")
              print(f"🐞 Debug info saved to {debug_file}")
          PYEOF

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Telegram Export/"
          git diff --staged --quiet || (git commit -m "📤 Export + debug info for ${{ github.event.inputs.channel_name }}" && git push)