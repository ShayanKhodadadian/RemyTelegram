name: Telegram Channel Export (Final)

on:
  workflow_dispatch:
    inputs:
      channel_name:
        description: 'نام کانال (بدون @)'
        required: true
        default: 'DeutschMahroo'
      message_count:
        description: 'تعداد پیام‌های اخیر'
        required: true
        default: '30'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install beautifulsoup4 requests

      - name: Install Playwright for scraping & screenshot
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Extract messages with Playwright
        id: scrape
        env:
          CHANNEL: ${{ github.event.inputs.channel_name }}
          COUNT: ${{ github.event.inputs.message_count }}
        run: |
          python << 'PYEOF'
          import os, sys, json, datetime, time
          from playwright.sync_api import sync_playwright

          channel = os.environ['CHANNEL']
          target_count = int(os.environ['COUNT'])
          url = f'https://t.me/s/{channel}'
          out_dir = "Telegram Export"
          os.makedirs(out_dir, exist_ok=True)

          messages = []
          seen_ids = set()
          error_occurred = False

          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(
                  viewport={"width": 1280, "height": 900},
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  locale="en-US"
              )
              page = context.new_page()

              print(f"📡 رفتن به {url}")
              try:
                  page.goto(url, wait_until="networkidle", timeout=30000)
              except Exception as e:
                  print(f"❌ خطا در بارگذاری صفحه: {e}")
                  error_occurred = True
                  # حتی در صورت خطا اسکرین‌شات بگیریم
                  page.screenshot(path=os.path.join(out_dir, "debug_screenshot.png"), full_page=True)
                  with open(os.path.join(out_dir, "debug_page.html"), "w", encoding="utf-8") as f:
                      f.write(page.content())
                  browser.close()
                  sys.exit(1)

              # ذخیره اسکرین‌شات و HTML اولیه برای دیباگ
              page.screenshot(path=os.path.join(out_dir, "debug_screenshot.png"), full_page=True)
              with open(os.path.join(out_dir, "debug_page.html"), "w", encoding="utf-8") as f:
                  f.write(page.content())
              print("✅ اسکرین‌شات و HTML اولیه ذخیره شد")

              # تابع استخراج پیام‌ها از DOM جاری
              def extract_messages():
                  new_msgs = []
                  # تلگرام ممکنه از چند مدل wrapper استفاده کنه
                  wrappers = page.query_selector_all('.tgme_widget_message_wrap')
                  if not wrappers:
                      wrappers = page.query_selector_all('.tgme_widget_message_bubble')
                  if not wrappers:
                      wrappers = page.query_selector_all('[data-post]')
                  print(f"  → {len(wrappers)} wrapper پیدا شد")
                  for wrap in wrappers:
                      data_post = wrap.get_attribute('data-post')
                      if not data_post:
                          # ممکنه توی یه المنت والد باشه
                          parent = wrap.evaluate('el => el.closest("[data-post]")')
                          if parent:
                              data_post = parent.get_attribute('data-post')
                      if not data_post or '/' not in data_post:
                          continue
                      msg_id_str = data_post.split('/')[-1]
                      try:
                          msg_id = int(msg_id_str)
                      except ValueError:
                          continue
                      if msg_id in seen_ids:
                          continue
                      seen_ids.add(msg_id)

                      # متن پیام
                      text = ""
                      for sel in ['.tgme_widget_message_text', '.js-message_text', '[class*="message_text"]']:
                          text_el = wrap.query_selector(sel)
                          if text_el:
                              text = text_el.inner_text()
                              break

                      # فایل ضمیمه
                      file_info = None
                      doc_wrap = wrap.query_selector('.tgme_widget_message_document_wrap, [class*="document"]')
                      if doc_wrap:
                          file_link = doc_wrap.get_attribute('href')
                          title_el = wrap.query_selector('.tgme_widget_message_document_title, [class*="document_title"]')
                          file_name = title_el.inner_text().strip() if title_el else "unknown_file"
                          file_info = {
                              "file_name": file_name,
                              "download_link": file_link or "not found"
                          }

                      # تاریخ
                      date_str = ""
                      date_el = wrap.query_selector('time, [class*="time"]')
                      if date_el:
                          date_str = date_el.get_attribute('datetime') or date_el.inner_text().strip()

                      new_msgs.append({
                          "message_id": msg_id,
                          "date": date_str,
                          "text": text,
                          "file": file_info,
                          "message_link": f"https://t.me/{channel}/{msg_id}"
                      })
                  return new_msgs

              # استخراج اولیه
              messages.extend(extract_messages())

              # کلیک روی "Load earlier messages" تا وقتی که تعداد کافی پیام جمع بشه
              max_pages = 20  # جلوگیری از حلقه بی‌نهایت
              page_num = 1
              while len(messages) < target_count and page_num < max_pages:
                  # دنبال لینک "Load earlier messages" می‌گردیم
                  more_link = page.query_selector('a.tme_messages_more, [class*="messages_more"]')
                  if not more_link:
                      print("  → لینک «بارگذاری پیام‌های قدیمی‌تر» پیدا نشد")
                      break
                  print(f"  📄 کلیک روی لینک صفحه {page_num + 1} ...")
                  try:
                      # کلیک و منتظر بارگذاری محتوای جدید
                      # wait_until="networkidle" بعد از کلیک
                      more_link.click()
                      page.wait_for_load_state("networkidle", timeout=15000)
                      time.sleep(1)  # یکم فرصت بده DOM آپدیت بشه
                  except Exception as e:
                      print(f"  ⚠️ خطا هنگام کلیک: {e}")
                      break

                  new_msgs = extract_messages()
                  print(f"  → {len(new_msgs)} پیام جدید استخراج شد")
                  if not new_msgs:
                      print("  ⚠️ هیچ پیام تازه‌ای پیدا نشد")
                      break
                  messages.extend(new_msgs)
                  page_num += 1

              browser.close()

          # مرتب‌سازی و برش به تعداد درخواستی
          messages = messages[:target_count]
          messages.sort(key=lambda m: m['message_id'], reverse=True)

          timestamp = datetime.datetime.now().strftime("%Y-%m-%d_%H-%M-%S")
          filepath = os.path.join(out_dir, f"export_{timestamp}.json")
          export_data = {
              "channel": channel,
              "channel_url": f"https://t.me/{channel}",
              "extracted_at": timestamp,
              "requested_count": target_count,
              "actual_count": len(messages),
              "messages": messages,
              "error_occurred": error_occurred
          }
          with open(filepath, 'w', encoding='utf-8') as f:
              json.dump(export_data, f, ensure_ascii=False, indent=2)

          print(f"\n✅ {len(messages)} پیام استخراج و در {filepath} ذخیره شد.")
          if error_occurred and len(messages) == 0:
              sys.exit(1)
          PYEOF

      - name: Commit and push results
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Telegram Export/"
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📤 Export for ${{ github.event.inputs.channel_name }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi