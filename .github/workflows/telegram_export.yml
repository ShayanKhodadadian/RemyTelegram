name: Telegram Channel Export (Final)

on:
  workflow_dispatch:
    inputs:
      channel_name:
        description: 'نام کانال (بدون @)'
        required: true
        default: 'DeutschMahroo'
      message_count:
        description: 'تعداد پیام‌های اخیر'
        required: true
        default: '30'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install beautifulsoup4 playwright playwright-stealth

      - name: Install Chromium browser for Playwright
        run: python -m playwright install chromium --with-deps

      - name: Scrape Telegram channel
        id: scrape
        env:
          CHANNEL: ${{ github.event.inputs.channel_name }}
          COUNT: ${{ github.event.inputs.message_count }}
        run: |
          python << 'PYEOF'
          import os, sys, json, datetime, time, traceback
          from playwright.sync_api import sync_playwright, TimeoutError
          from playwright_stealth import stealth_sync
          from bs4 import BeautifulSoup

          channel = os.environ['CHANNEL']
          count = int(os.environ['COUNT'])
          url = f'https://t.me/s/{channel}'

          out_dir = "Telegram Export"
          os.makedirs(out_dir, exist_ok=True)

          # مسیرهای ثابت برای اسکرین‌شات‌ها
          screenshot_initial = os.path.join(out_dir, "screenshot_initial.png")
          screenshot_final   = os.path.join(out_dir, "screenshot_final.png")
          screenshot_error   = os.path.join(out_dir, "screenshot_error.png")

          messages = []
          error_occurred = False
          page = None
          browser = None

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          '--no-sandbox',
                          '--disable-setuid-sandbox',
                          '--disable-blink-features=AutomationControlled'
                      ]
                  )
                  context = browser.new_context(
                      viewport={'width': 1280, 'height': 800},
                      locale='en-US'
                  )
                  page = context.new_page()
                  stealth_sync(page)

                  print(f"🌐 رفتن به {url}")
                  page.goto(url, wait_until='domcontentloaded', timeout=30000)
                  page.wait_for_timeout(8000)

                  # اسکرین‌شات اولیه – همیشه ذخیره شود
                  page.screenshot(path=screenshot_initial)
                  print(f"📸 اسکرین‌شات اولیه در {screenshot_initial} ذخیره شد.")

                  # اگر صفحه پیش‌نمایش آمد، دوباره تلاش کن
                  if 'VIEW IN TELEGRAM' in page.content():
                      print("⚠️ صفحه پیش‌نمایش – تلاش دوباره با user-agent جدید...")
                      page.screenshot(path=screenshot_error)  # ذخیره وضعیت پیش‌نمایش
                      context.close()
                      context = browser.new_context(
                          user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
                          viewport={'width': 1280, 'height': 800},
                          locale='en-US'
                      )
                      page = context.new_page()
                      stealth_sync(page)
                      page.goto(url, wait_until='domcontentloaded', timeout=30000)
                      page.wait_for_timeout(8000)
                      # اسکرین‌شات بعد از تلاش مجدد
                      page.screenshot(path=screenshot_initial)  # بازنویسی اسکرین‌شات اولیه

                  if 'VIEW IN TELEGRAM' in page.content():
                      print("❌ همچنان صفحه پیش‌نمایش – دسترسی ناموفق.")
                      page.screenshot(path=screenshot_error)
                      error_occurred = True
                  else:
                      try:
                          page.wait_for_selector('.tgme_widget_message_wrap', timeout=15000)
                          print("✅ پیام‌ها بارگذاری شدند.")
                      except TimeoutError:
                          print("⏰ پیام‌ها پیدا نشدند.")
                          page.screenshot(path=screenshot_error)
                          error_occurred = True

                  if not error_occurred:
                      previous_count = 0
                      retry_scroll = 0
                      while len(messages) < count and retry_scroll < 10:
                          html = page.content()
                          soup = BeautifulSoup(html, 'html.parser')
                          wrappers = soup.select('.tgme_widget_message_wrap')
                          if not wrappers:
                              break

                          for wrap in wrappers:
                              if len(messages) >= count:
                                  break
                              msg_id_raw = wrap.get('data-post', '')
                              if not msg_id_raw or '/' not in msg_id_raw:
                                  continue
                              msg_id_num = msg_id_raw.split('/')[-1]
                              if any(m['message_id'] == int(msg_id_num) for m in messages):
                                  continue

                              text_div = wrap.select_one('.tgme_widget_message_text')
                              text = text_div.get_text(strip=True) if text_div else ""

                              file_info = None
                              doc_wrap = wrap.select_one('.tgme_widget_message_document_wrap')
                              if doc_wrap:
                                  file_link = doc_wrap.get('href')
                                  title_el = wrap.select_one('.tgme_widget_message_document_title')
                                  file_name = title_el.get_text(strip=True) if title_el else "unknown_file"
                                  file_info = {
                                      "file_name": file_name,
                                      "download_link": file_link or "not found"
                                  }

                              messages.append({
                                  "message_id": int(msg_id_num),
                                  "text": text,
                                  "file": file_info,
                                  "message_link": f"https://t.me/{channel}/{msg_id_num}"
                              })

                          if len(messages) == previous_count:
                              retry_scroll += 1
                          else:
                              retry_scroll = 0
                          previous_count = len(messages)

                          if len(messages) < count:
                              page.evaluate('window.scrollTo(0, document.body.scrollHeight)')
                              time.sleep(3)

                      # اسکرین‌شات نهایی (تمام‌صفحه)
                      page.screenshot(path=screenshot_final, full_page=True)
                      print(f"📸 اسکرین‌شات نهایی در {screenshot_final} ذخیره شد. {len(messages)} پیام استخراج شد.")

                  if browser:
                      browser.close()

          except Exception as e:
              print(f"🔥 خطا: {e}")
              traceback.print_exc()
              error_occurred = True
              # سعی کن از صفحه فعلی اسکرین‌شات بگیری (اگر page هنوز زنده باشه)
              try:
                  if page:
                      page.screenshot(path=screenshot_error)
                      print(f"⚠️ اسکرین‌شات خطا در {screenshot_error} ذخیره شد.")
              except:
                  print("نتوانستیم اسکرین‌شات خطا بگیریم.")

          # ذخیره داده‌ها
          timestamp = datetime.datetime.now().strftime("%Y-%m-%d_%H-%M-%S")
          filepath = os.path.join(out_dir, f"export_{timestamp}.json")
          export_data = {
              "channel": channel,
              "extracted_at": timestamp,
              "requested_count": count,
              "actual_count": len(messages),
              "messages": messages[:count],
              "error_occurred": error_occurred
          }
          with open(filepath, 'w', encoding='utf-8') as f:
              json.dump(export_data, f, ensure_ascii=False, indent=2)

          print(f"✅ فایل JSON ذخیره شد: {filepath}")
          if error_occurred:
              sys.exit(1)
          PYEOF

      - name: Commit and push results
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Telegram Export/"
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📤 Export for ${{ github.event.inputs.channel_name }}"
            git push
          fi