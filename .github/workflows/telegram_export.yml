name: Telegram Channel Export (Final)

on:
  workflow_dispatch:
    inputs:
      channel_name:
        description: 'نام کانال (بدون @)'
        required: true
        default: 'DeutschMahroo'
      message_count:
        description: 'تعداد پیام‌های اخیر'
        required: true
        default: '30'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium
          playwright install-deps chromium

      - name: Scrape Telegram channel with Playwright + debug screenshot
        id: scrape
        env:
          CHANNEL: ${{ github.event.inputs.channel_name }}
          COUNT: ${{ github.event.inputs.message_count }}
        run: |
          python << 'PYEOF'
          import os, sys, json, datetime, time, re
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          channel = os.environ['CHANNEL']
          count = int(os.environ['COUNT'])
          base_url = f'https://t.me/s/{channel}'
          out_dir = "Telegram Export"
          os.makedirs(out_dir, exist_ok=True)

          messages = []
          seen_ids = set()
          error_occurred = False

          def extract_messages(html, channel):
              found = []
              soup = BeautifulSoup(html, 'html.parser')
              wrappers = soup.find_all(attrs={"data-post": True})
              print(f"  → {len(wrappers)} پیام پیدا شد")
              for wrap in wrappers:
                  data_post = wrap.get('data-post', '')
                  if '/' not in data_post:
                      continue
                  try:
                      msg_id = int(data_post.split('/')[-1])
                  except ValueError:
                      continue
                  if msg_id in seen_ids:
                      continue
                  seen_ids.add(msg_id)

                  # Text
                  text = ""
                  for sel in ['.tgme_widget_message_text', '[class*="message_text"]']:
                      el = wrap.select_one(sel)
                      if el:
                          text = el.get_text(separator=' ', strip=True)
                          break

                  # File/document attachment
                  file_info = None
                  for sel in ['.tgme_widget_message_document_wrap', '[class*="document_wrap"]']:
                      doc = wrap.select_one(sel)
                      if doc:
                          link = doc.get('href', 'not found')
                          title_el = wrap.select_one('.tgme_widget_message_document_title') or \
                                     wrap.select_one('[class*="document_title"]')
                          fname = title_el.get_text(strip=True) if title_el else "unknown_file"
                          ext_el = wrap.select_one('[class*="document_extra"]')
                          ext = ext_el.get_text(strip=True) if ext_el else ""
                          file_info = {"file_name": fname, "extension": ext, "link": link}
                          break

                  # Date
                  date_str = ""
                  time_el = wrap.select_one('time')
                  if time_el:
                      date_str = time_el.get('datetime', time_el.get_text(strip=True))

                  # Views
                  views = ""
                  views_el = wrap.select_one('[class*="views"]')
                  if views_el:
                      views = views_el.get_text(strip=True)

                  found.append({
                      "message_id": msg_id,
                      "date": date_str,
                      "views": views,
                      "text": text[:500] if text else "",
                      "file": file_info,
                      "message_link": f"https://t.me/{channel}/{msg_id}"
                  })
              return found

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
                  locale='en-US',
                  viewport={"width": 1280, "height": 900}
              )
              page = context.new_page()

              print(f"🌐 باز کردن {base_url}")
              try:
                  page.goto(base_url, wait_until='networkidle', timeout=30000)
              except Exception as e:
                  print(f"⚠️ timeout یا خطا در بارگذاری اولیه: {e}")

              # Screenshot of initial page load
              screenshot_path = os.path.join(out_dir, "debug_screenshot_initial.png")
              page.screenshot(path=screenshot_path, full_page=True)
              print(f"📸 اسکرین‌شات اولیه ذخیره شد: {screenshot_path}")

              # Check if we landed on the right page (message feed vs profile page)
              html = page.content()
              if 'tgme_widget_message' not in html and 'data-post' not in html:
                  print("⚠️ صفحه پروفایل کانال بارگذاری شد، نه فید پیام‌ها.")
                  print("  → تلاش برای کلیک روی دکمه View in Telegram / پیوند پیام‌ها...")
                  # Try clicking "View in Telegram" or similar CTA
                  try:
                      page.click('a[href*="t.me"]:has-text("View")', timeout=3000)
                      page.wait_for_load_state('networkidle', timeout=10000)
                  except:
                      pass
                  # Save the profile HTML for debugging
                  with open(os.path.join(out_dir, "debug_profile_page.html"), 'w', encoding='utf-8') as f:
                      f.write(html)
                  html = page.content()

              # Scroll up to load older messages until we have enough
              page_num = 1
              while len(messages) < count:
                  html = page.content()
                  new_msgs = extract_messages(html, channel)
                  added = 0
                  for m in new_msgs:
                      if m['message_id'] not in seen_ids or True:  # seen_ids handled inside extract
                          messages.append(m)
                          added += 1

                  # De-duplicate after merging
                  unique = {}
                  for m in messages:
                      unique[m['message_id']] = m
                  messages = list(unique.values())

                  print(f"  [{page_num}] کل پیام‌های جمع‌آوری‌شده: {len(messages)}")

                  if len(messages) >= count:
                      break

                  # Click "Load more" button or scroll to top to trigger pagination
                  loaded_more = False
                  for selector in ['a.tme_messages_more', '[class*="messages_more"]', 'a[href*="before="]']:
                      try:
                          btn = page.query_selector(selector)
                          if btn:
                              btn.click()
                              page.wait_for_load_state('networkidle', timeout=10000)
                              time.sleep(1)
                              loaded_more = True
                              page_num += 1
                              break
                      except:
                          pass

                  if not loaded_more:
                      print("  → دکمه بارگذاری بیشتر پیدا نشد، توقف.")
                      break

              # Final screenshot after scrolling
              page.screenshot(path=os.path.join(out_dir, "debug_screenshot_final.png"), full_page=True)
              print(f"📸 اسکرین‌شات نهایی ذخیره شد.")

              browser.close()

          if not messages:
              print("❌ هیچ پیامی استخراج نشد.")
              error_occurred = True

          # Sort newest first, trim to count
          messages.sort(key=lambda m: m['message_id'], reverse=True)
          messages = messages[:count]

          timestamp = datetime.datetime.now().strftime("%Y-%m-%d_%H-%M-%S")
          filepath = os.path.join(out_dir, f"export_{timestamp}.json")
          export_data = {
              "channel": channel,
              "channel_url": f"https://t.me/{channel}",
              "extracted_at": timestamp,
              "requested_count": count,
              "actual_count": len(messages),
              "messages": messages,
              "error_occurred": error_occurred
          }
          with open(filepath, 'w', encoding='utf-8') as f:
              json.dump(export_data, f, ensure_ascii=False, indent=2)

          print(f"\n✅ {len(messages)} پیام در {filepath} ذخیره شد.")
          if error_occurred:
              sys.exit(1)
          PYEOF

      - name: Commit and push results
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Telegram Export/"
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📤 Export for ${{ github.event.inputs.channel_name }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi