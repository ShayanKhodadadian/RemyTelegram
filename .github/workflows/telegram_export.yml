name: Telegram Channel Export (Screenshots in Export)

on:
  workflow_dispatch:
    inputs:
      channel_name:
        description: 'نام کانال (بدون @)'
        required: true
        default: 'DeutschMahroo'
      message_count:
        description: 'تعداد پیام‌های اخیر'
        required: true
        default: '20'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libdbus-1-3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Install Python dependencies
        run: pip install playwright beautifulsoup4

      - name: Install Playwright Chromium browser
        run: python -m playwright install chromium

      - name: Scrape Telegram channel (with in-folder screenshots)
        id: scrape
        env:
          CHANNEL: ${{ github.event.inputs.channel_name }}
          COUNT: ${{ github.event.inputs.message_count }}
        run: |
          python << 'PYEOF'
          import os, json, datetime, time, sys
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeout
          from bs4 import BeautifulSoup

          channel = os.environ['CHANNEL']
          count = int(os.environ['COUNT'])
          url = f'https://t.me/s/{channel}'

          # پوشه اصلی خروجی را از ابتدا می‌سازیم
          out_dir = "Telegram Export"
          os.makedirs(out_dir, exist_ok=True)

          messages = []

          # اسکرین‌شات‌ها با نام ثابت در همین پوشه ذخیره می‌شوند
          screenshot_initial = os.path.join(out_dir, "debug_initial.png")
          screenshot_error = os.path.join(out_dir, "debug_error.png")
          screenshot_final = os.path.join(out_dir, "debug_final.png")
          screenshot_unexpected = os.path.join(out_dir, "debug_unexpected.png")

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox', '--disable-setuid-sandbox']
                  )
                  context = browser.new_context(
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                      viewport={'width': 1280, 'height': 800}
                  )
                  page = context.new_page()

                  print(f"🌐 رفتن به آدرس: {url}")
                  page.goto(url, timeout=30000, wait_until='networkidle')
                  print(f"📄 عنوان صفحه: {page.title()}")

                  # اسکرین‌شات اولیه
                  page.screenshot(path=screenshot_initial)
                  print(f"📸 اسکرین‌شات اولیه در {screenshot_initial} ذخیره شد.")

                  # منتظر ماندن برای ظاهر شدن پیام‌ها
                  try:
                      page.wait_for_selector('.tgme_widget_message_wrap', timeout=20000)
                      print("✅ پیام‌ها در صفحه ظاهر شدند.")
                  except PlaywrightTimeout:
                      print("⏰ پیام‌ها در زمان مقرر بارگذاری نشدند.")
                      page.screenshot(path=screenshot_error)
                      print(f"❌ اسکرین‌شات خطا در {screenshot_error} ذخیره شد. خروج.")
                      browser.close()
                      sys.exit(1)

                  # اسکرول و استخراج پیام‌ها
                  previous_count = 0
                  while len(messages) < count:
                      html = page.content()
                      soup = BeautifulSoup(html, 'html.parser')
                      wrappers = soup.select('.tgme_widget_message_wrap')

                      for wrap in wrappers:
                          msg_id_raw = wrap.get('data-post', '')
                          if not msg_id_raw or '/' not in msg_id_raw:
                              continue
                          msg_id_num = msg_id_raw.split('/')[-1]

                          if any(m['message_id'] == int(msg_id_num) for m in messages):
                              continue

                          text_div = wrap.select_one('.tgme_widget_message_text')
                          text = text_div.get_text(strip=True) if text_div else ""

                          file_info = None
                          doc_wrap = wrap.select_one('.tgme_widget_message_document_wrap')
                          if doc_wrap:
                              file_link = doc_wrap.get('href')
                              title_el = wrap.select_one('.tgme_widget_message_document_title')
                              file_name = title_el.get_text(strip=True) if title_el else "unknown_file"
                              file_info = {
                                  "file_name": file_name,
                                  "download_link": file_link or "not found"
                              }

                          messages.append({
                              "message_id": int(msg_id_num),
                              "text": text,
                              "file": file_info,
                              "message_link": f"https://t.me/{channel}/{msg_id_num}"
                          })

                          if len(messages) >= count:
                              break

                      if len(messages) == previous_count:
                          print("ℹ️  پیام جدیدی بارگذاری نشد (پایان کانال یا خطا). توقف.")
                          break
                      previous_count = len(messages)

                      if len(messages) < count:
                          last_wrapper = page.query_selector('.tgme_widget_message_wrap:last-child')
                          if last_wrapper:
                              last_wrapper.scroll_into_view_if_needed()
                              time.sleep(2.5)

                  # اسکرین‌شات نهایی
                  page.screenshot(path=screenshot_final)
                  print(f"📸 اسکرین‌شات نهایی در {screenshot_final} ذخیره شد.")
                  browser.close()

          except Exception as e:
              print(f"🔥 خطای غیرمنتظره: {e}")
              try:
                  if 'page' in locals():
                      page.screenshot(path=screenshot_unexpected)
                      print(f"📸 اسکرین‌شات خطای پیش‌بینی‌نشده در {screenshot_unexpected} ذخیره شد.")
              except:
                  pass
              sys.exit(1)

          # ذخیره JSON نهایی
          timestamp = datetime.datetime.now().strftime("%Y-%m-%d_%H-%M-%S")
          filename = f"export_{timestamp}.json"
          filepath = os.path.join(out_dir, filename)

          with open(filepath, 'w', encoding='utf-8') as f:
              json.dump(messages[:count], f, ensure_ascii=False, indent=2)

          print(f"✅ {len(messages[:count])} پیام در {filepath} ذخیره شد.")
          PYEOF

      - name: Upload debug screenshots (as artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-export-files
          path: Telegram Export/        # کل پوشه (هم JSON هم اسکرین‌شات‌ها) آپلود می‌شود
          retention-days: 3

      - name: Commit and push all export results
        if: always()   # حتی اگر scrape شکست خورد، اسکرین‌شات‌ها commit شوند
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # فقط اگر تغییری در پوشه Telegram Export باشد commit می‌کنیم
          git add "Telegram Export/"
          if git diff --staged --quiet; then
            echo "هیچ تغییری در Telegram Export وجود ندارد."
          else
            git commit -m "📤 Telegram export + debug screenshots for ${{ github.event.inputs.channel_name }}"
            git push
          fi