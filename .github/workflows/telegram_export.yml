name: Telegram Channel Export (Browser)

on:
  workflow_dispatch:
    inputs:
      channel_name:
        description: 'نام کانال (بدون @)'
        required: true
        default: 'DeutschMahroo'
      message_count:
        description: 'تعداد پیام‌های اخیر'
        required: true
        default: '20'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install playwright beautifulsoup4

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Scrape Telegram channel
        env:
          CHANNEL: ${{ github.event.inputs.channel_name }}
          COUNT: ${{ github.event.inputs.message_count }}
        run: |
          python << 'PYEOF'
          import os, json, datetime, time
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup

          channel = os.environ['CHANNEL']
          count = int(os.environ['COUNT'])
          url = f'https://t.me/s/{channel}'

          messages = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              )
              page = context.new_page()
              page.goto(url, timeout=30000)

              # منتظر می‌مانیم تا پیام‌ها ظاهر شوند
              try:
                  page.wait_for_selector('.tgme_widget_message_wrap', timeout=15000)
              except:
                  print("⚠️ پیام‌ها به‌موقع بارگذاری نشدند. صفحه ممکن است خالی باشد.")
                  browser.close()
                  exit(1)

              # اسکرول برای دریافت تعداد مورد نیاز
              previous_count = 0
              while len(messages) < count:
                  # هر بار HTML فعلی را می‌گیریم و پیام‌ها را استخراج می‌کنیم
                  html = page.content()
                  soup = BeautifulSoup(html, 'html.parser')
                  wrappers = soup.select('.tgme_widget_message_wrap')

                  for wrap in wrappers:
                      msg_id_raw = wrap.get('data-post', '')
                      if not msg_id_raw or '/' not in msg_id_raw:
                          continue
                      msg_id_num = msg_id_raw.split('/')[-1]

                      # جلوگیری از تکراری شدن پیام‌ها
                      if any(m['message_id'] == int(msg_id_num) for m in messages):
                          continue

                      text_div = wrap.select_one('.tgme_widget_message_text')
                      text = text_div.get_text(strip=True) if text_div else ""

                      file_info = None
                      doc_wrap = wrap.select_one('.tgme_widget_message_document_wrap')
                      if doc_wrap:
                          file_link = doc_wrap.get('href')
                          title_el = wrap.select_one('.tgme_widget_message_document_title')
                          file_name = title_el.get_text(strip=True) if title_el else "unknown_file"
                          file_info = {
                              "file_name": file_name,
                              "download_link": file_link or "not found"
                          }

                      messages.append({
                          "message_id": int(msg_id_num),
                          "text": text,
                          "file": file_info,
                          "message_link": f"https://t.me/{channel}/{msg_id_num}"
                      })

                      if len(messages) >= count:
                          break

                  # اگر تعداد پیام‌ها تغییری نکرد، یعنی به ته کانال رسیده‌ایم
                  if len(messages) == previous_count:
                      break
                  previous_count = len(messages)

                  if len(messages) < count:
                      # اسکرول به آخرین پیام برای بارگذاری بیشتر
                      last_wrapper = page.query_selector('.tgme_widget_message_wrap:last-child')
                      if last_wrapper:
                          last_wrapper.scroll_into_view_if_needed()
                          time.sleep(2)  # صبر برای لود شدن پیام‌های جدید

              browser.close()

          # ذخیره‌سازی
          out_dir = "Telegram Export"
          os.makedirs(out_dir, exist_ok=True)
          timestamp = datetime.datetime.now().strftime("%Y-%m-%d_%H-%M-%S")
          filepath = os.path.join(out_dir, f"export_{timestamp}.json")

          with open(filepath, 'w', encoding='utf-8') as f:
              json.dump(messages[:count], f, ensure_ascii=False, indent=2)

          print(f"✅ {len(messages[:count])} پیام در {filepath} ذخیره شد.")
          PYEOF

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Telegram Export/"
          git diff --staged --quiet || (git commit -m "📤 Export Telegram messages for ${{ github.event.inputs.channel_name }}" && git push)