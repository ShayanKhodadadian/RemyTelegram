name: Telegram Channel Export (Final)

on:
  workflow_dispatch:
    inputs:
      channel_name:
        description: 'نام کانال (بدون @)'
        required: true
        default: 'DeutschMahroo'
      message_count:
        description: 'تعداد پیام‌های اخیر'
        required: true
        default: '30'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install beautifulsoup4 requests

      - name: Scrape Telegram channel (HTTP)
        id: scrape
        env:
          CHANNEL: ${{ github.event.inputs.channel_name }}
          COUNT: ${{ github.event.inputs.message_count }}
        run: |
          python << 'PYEOF'
          import os, sys, json, datetime, requests, re, time
          from bs4 import BeautifulSoup

          channel = os.environ['CHANNEL']
          count = int(os.environ['COUNT'])
          base_url = f'https://t.me/s/{channel}'

          out_dir = "Telegram Export"
          os.makedirs(out_dir, exist_ok=True)

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8',
          }

          messages = []
          seen_ids = set()
          error_occurred = False
          next_url = base_url

          while len(messages) < count and next_url:
              print(f"📡 دریافت صفحه: {next_url}")
              try:
                  resp = requests.get(next_url, headers=headers, timeout=15)
                  resp.raise_for_status()
              except Exception as e:
                  print(f"❌ خطا در دریافت صفحه: {e}")
                  error_occurred = True
                  break

              soup = BeautifulSoup(resp.text, 'html.parser')
              wrappers = soup.select('.tgme_widget_message_wrap')
              if not wrappers:
                  print("⚠️ هیچ پیامی در صفحه پیدا نشد (ممکن است صفحه پیش‌نمایش باشد).")
                  # می‌توانید محتوای صفحه را برای بررسی ذخیره کنید
                  with open(os.path.join(out_dir, "preview.html"), 'w', encoding='utf-8') as f:
                      f.write(resp.text)
                  error_occurred = True
                  break

              for wrap in wrappers:
                  if len(messages) >= count:
                      break
                  data_post = wrap.get('data-post')
                  if not data_post or '/' not in data_post:
                      continue
                  msg_id_str = data_post.split('/')[-1]
                  try:
                      msg_id = int(msg_id_str)
                  except ValueError:
                      continue
                  if msg_id in seen_ids:
                      continue
                  seen_ids.add(msg_id)

                  text_div = wrap.select_one('.tgme_widget_message_text')
                  text = text_div.get_text(strip=True) if text_div else ""

                  file_info = None
                  doc_wrap = wrap.select_one('.tgme_widget_message_document_wrap')
                  if doc_wrap:
                      file_link = doc_wrap.get('href')
                      title_el = wrap.select_one('.tgme_widget_message_document_title')
                      file_name = title_el.get_text(strip=True) if title_el else "unknown_file"
                      file_info = {
                          "file_name": file_name,
                          "download_link": file_link or "not found"
                      }

                  messages.append({
                      "message_id": msg_id,
                      "text": text,
                      "file": file_info,
                      "message_link": f"https://t.me/{channel}/{msg_id}"
                  })

              # پیدا کردن لینک "Load earlier messages" برای صفحه‌بندی
              if len(messages) < count:
                  more_link = soup.select_one('a.tme_messages_more')
                  if more_link and more_link.get('href'):
                      next_url = more_link['href']
                      if not next_url.startswith('http'):
                          next_url = f'https://t.me{next_url}'
                      time.sleep(1)  # احترام به سرور
                  else:
                      next_url = None

          timestamp = datetime.datetime.now().strftime("%Y-%m-%d_%H-%M-%S")
          filepath = os.path.join(out_dir, f"export_{timestamp}.json")
          export_data = {
              "channel": channel,
              "extracted_at": timestamp,
              "requested_count": count,
              "actual_count": len(messages),
              "messages": messages[:count],
              "error_occurred": error_occurred
          }
          with open(filepath, 'w', encoding='utf-8') as f:
              json.dump(export_data, f, ensure_ascii=False, indent=2)

          print(f"✅ {len(messages)} پیام استخراج و در {filepath} ذخیره شد.")
          if error_occurred:
              sys.exit(1)
          PYEOF

      - name: Commit and push results
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Telegram Export/"
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📤 Export for ${{ github.event.inputs.channel_name }}"
            git push
          fi