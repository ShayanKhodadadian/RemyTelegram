name: Telegram Channel Export (Simple & Fast)

on:
  workflow_dispatch:
    inputs:
      channel_name:
        description: 'نام کانال (بدون @)'
        required: true
        default: 'DeutschMahroo'
      message_count:
        description: 'تعداد پیام‌های اخیر'
        required: true
        default: '20'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Export Telegram messages
        env:
          CHANNEL: ${{ github.event.inputs.channel_name }}
          COUNT: ${{ github.event.inputs.message_count }}
        run: |
          python << 'PYEOF'
          import os, json, datetime, time, sys
          import requests
          from bs4 import BeautifulSoup

          channel = os.environ['CHANNEL']
          count = int(os.environ['COUNT'])
          url = f'https://t.me/s/{channel}'

          # هدرهایی که تلگرام را مجاب می‌کنند محتوای کامل را برگرداند
          headers = {
              'User-Agent': 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.5',
          }

          messages = []
          current_url = url
          errors = []

          while len(messages) < count:
              try:
                  resp = requests.get(current_url, headers=headers, timeout=15)
                  if resp.status_code != 200:
                      errors.append(f"Status {resp.status_code} at {current_url}")
                      break
              except Exception as e:
                  errors.append(f"Request error: {e}")
                  break

              soup = BeautifulSoup(resp.text, 'html.parser')
              wrappers = soup.select('.tgme_widget_message_wrap')

              if not wrappers:
                  # شاید صفحه پیش‌نمایش باشد
                  if 'VIEW IN TELEGRAM' in resp.text:
                      errors.append("Got preview page, not messages list. Maybe the channel is private or blocked?")
                  else:
                      errors.append("No message containers found. HTML structure changed?")
                  break

              for wrap in wrappers:
                  if len(messages) >= count:
                      break
                  msg_id_raw = wrap.get('data-post', '')
                  if not msg_id_raw or '/' not in msg_id_raw:
                      continue
                  msg_id_num = msg_id_raw.split('/')[-1]

                  # جلوگیری از تکراری
                  if any(m['message_id'] == int(msg_id_num) for m in messages):
                      continue

                  text_div = wrap.select_one('.tgme_widget_message_text')
                  text = text_div.get_text(strip=True) if text_div else ""

                  file_info = None
                  doc_wrap = wrap.select_one('.tgme_widget_message_document_wrap')
                  if doc_wrap:
                      file_link = doc_wrap.get('href')
                      title_el = wrap.select_one('.tgme_widget_message_document_title')
                      file_name = title_el.get_text(strip=True) if title_el else "unknown_file"
                      file_info = {
                          "file_name": file_name,
                          "download_link": file_link or "not found"
                      }

                  messages.append({
                      "message_id": int(msg_id_num),
                      "text": text,
                      "file": file_info,
                      "message_link": f"https://t.me/{channel}/{msg_id_num}"
                  })

              # صفحه‌ی بعد
              if wrappers and len(messages) < count:
                  last_id = wrappers[-1].get('data-post', '').split('/')[-1]
                  if last_id:
                      current_url = f"{url}?before={last_id}"
                      time.sleep(1)
                  else:
                      break
              else:
                  break

          # ذخیره خروجی
          out_dir = "Telegram Export"
          os.makedirs(out_dir, exist_ok=True)
          timestamp = datetime.datetime.now().strftime("%Y-%m-%d_%H-%M-%S")
          filepath = os.path.join(out_dir, f"export_{timestamp}.json")

          export_data = {
              "channel": channel,
              "extracted_at": timestamp,
              "requested_count": count,
              "actual_count": len(messages),
              "messages": messages[:count],
              "errors": errors
          }

          with open(filepath, 'w', encoding='utf-8') as f:
              json.dump(export_data, f, ensure_ascii=False, indent=2)

          print(f"✅ {len(messages)} پیام استخراج شد. خروجی: {filepath}")
          if errors:
              print(f"⚠️  خطاها: {errors}")
          PYEOF

      - name: Commit and push export
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Telegram Export/"
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "📤 Export for ${{ github.event.inputs.channel_name }}"
            git push
          fi