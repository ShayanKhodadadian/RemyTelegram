name: Download Telegram File and Split

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: "Telegram public link"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm packages
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Create script
        run: |
          cat > download.js << 'EOF'
          const puppeteer = require("puppeteer-extra");
          const StealthPlugin = require("puppeteer-extra-plugin-stealth");
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          puppeteer.use(StealthPlugin());

          (async () => {
            const telegramLink = process.argv[2];
            if (!telegramLink) throw new Error("No telegram link");

            const downloadsDir = "Downloads";
            if (!fs.existsSync(downloadsDir)) {
              fs.mkdirSync(downloadsDir, { recursive: true });
            }

            console.log("Launching stealth browser");
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-blink-features=AutomationControlled",
                "--disable-dev-shm-usage"
              ]
            });

            let directPage;
            try {
              const page = await browser.newPage();
              await page.setUserAgent(
                "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
              );
              await page.setViewport({ width: 1366, height: 768 });
              page.setDefaultTimeout(90000);

              await page.evaluateOnNewDocument(() => {
                Object.defineProperty(navigator, 'webdriver', { get: () => false });
              });

              console.log("Opening site");
              await page.goto("https://telegramdownloader.net/", {
                waitUntil: "domcontentloaded",
                timeout: 90000
              });
              await new Promise(r => setTimeout(r, 10000));

              console.log("Current URL:", page.url());
              console.log("Page title:", await page.title());

              console.log("Waiting for textbox");
              await page.waitForSelector("#ts-telegram-link", { timeout: 90000 });

              await page.focus("#ts-telegram-link");
              await page.evaluate(() => document.querySelector("#ts-telegram-link").value = "");
              await page.type("#ts-telegram-link", telegramLink, { delay: 100 });

              console.log("Click Download");
              await page.click("#ts-download-btn");

              try {
                await page.waitForSelector(".ts-download-link-button", { timeout: 30000 });
              } catch (btnError) {
                console.log("Did not find direct link button in 30s. Checking for error message...");
                const errorText = await page.evaluate(() => {
                  const el = document.querySelector('.alert-danger, .error-message, .ts-error');
                  return el ? el.innerText : null;
                });
                if (errorText) {
                  console.log("Site error message:", errorText);
                  throw new Error(`Site returned error: ${errorText}`);
                } else {
                  await page.screenshot({ path: path.join(downloadsDir, "debug.png"), fullPage: true });
                  throw new Error("Direct link button did not appear, no error message found. See debug.png");
                }
              }

              const href = await page.$eval(".ts-download-link-button", el => el.href);
              console.log("Direct page:", href);

              directPage = await browser.newPage();
              await directPage.goto(href, { waitUntil: "networkidle2" });
              console.log("Waiting timer...");
              await directPage.waitForSelector("#download-btn", { timeout: 30000 });
              await new Promise(r => setTimeout(r, 16000));

              // --- تنظیم مسیر دانلود با CDP ---
              const cdpSession = await directPage.target().createCDPSession();
              await cdpSession.send("Page.setDownloadBehavior", {
                behavior: "allow",
                downloadPath: path.resolve(downloadsDir)
              });

              // لیست فایل‌های فعلی برای تشخیص فایل جدید
              const beforeFiles = fs.readdirSync(downloadsDir);

              console.log("Clicking final download button");
              await directPage.click("#download-btn");

              // منتظر اتمام دانلود (حداکثر ۳۰ ثانیه)
              console.log("Waiting for download to complete...");
              let downloadedFile = null;
              for (let i = 0; i < 30; i++) {
                await new Promise(r => setTimeout(r, 1000));
                const afterFiles = fs.readdirSync(downloadsDir);
                const newFiles = afterFiles.filter(
                  f => !beforeFiles.includes(f) && !f.endsWith(".crdownload")
                );
                if (newFiles.length > 0) {
                  downloadedFile = newFiles[0];
                  break;
                }
              }

              if (!downloadedFile) {
                throw new Error("Download did not complete within 30 seconds");
              }

              const filePath = path.join(downloadsDir, downloadedFile);
              console.log("Downloaded file:", filePath);

              // تقسیم فایل اگر بزرگتر از ۴۵ مگابایت باشد
              const size = fs.statSync(filePath).size;
              const limit = 45 * 1024 * 1024; // 45 MB

              if (size > limit) {
                console.log("Splitting...");
                execSync(`split -b 45M -d "${filePath}" "${downloadsDir}/${downloadedFile}.part_"`);
                // حذف فایل اصلی
                fs.unlinkSync(filePath);
              } else {
                console.log("File size is below limit, no split needed.");
              }

              console.log("Done");
              await browser.close();

            } catch (e) {
              console.error("Error occurred:", e);

              try {
                if (browser && browser.isConnected()) {
                  const pages = await browser.pages();
                  const currentPage = pages.length > 0 ? pages[pages.length - 1] : null;
                  if (currentPage) {
                    const screenshotPath = path.join(downloadsDir, "debug.png");
                    await currentPage.screenshot({ path: screenshotPath, fullPage: true });
                    console.log(`Screenshot saved to ${screenshotPath}`);
                  }
                }
              } catch (ssError) {
                console.error("Could not capture screenshot:", ssError);
              }

              await browser.close();
              process.exit(1);
            }
          })();
          EOF

      - name: Run script
        env:
          LINK: ${{ github.event.inputs.telegram_link }}
        run: node download.js "$LINK"

      - name: Commit files (including debug screenshot if any)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d Downloads ]; then
            git add Downloads/
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Telegram files and/or debug screenshot"
            git push
          fi

      - name: Upload debug artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: Downloads/debug.png