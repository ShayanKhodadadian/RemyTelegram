name: Download Telegram File and Split

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: 'لینک عمومی پست تلگرام (مثلاً https://t.me/c/123/45)'
        required: true

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Create download script
        run: |
          cat << 'SCRIPT_EOF' > download.js
          const puppeteer = require('puppeteer');
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            // تابع کمکی برای کلیک روی یک المنت با چند انتخاب‌گر XPath
            async function clickWhenAnyXPath(page, xpaths, timeoutMs = 10000) {
            const start = Date.now();
            while (Date.now() - start < timeoutMs) {
                for (const xpath of xpaths) {
                const elements = await page.$x(xpath);
                if (elements.length > 0) {
                    await elements[0].click();
                    console.log(`Clicked element matching: ${xpath}`);
                    return true;
                }
                }
                await new Promise(r => setTimeout(r, 500));
            }
            return false;
            }

            (async () => {
            const telegramLink = process.argv[2];
            if (!telegramLink) {
                console.error('No Telegram link provided');
                process.exit(1);
            }

            console.log('Launching browser...');
            const browser = await puppeteer.launch({
                headless: 'new',
                args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            try {
                const page = await browser.newPage();
                await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');

                console.log('Navigating to telegramdownloader.net...');
                await page.goto('https://telegramdownloader.net/', {
                waitUntil: 'networkidle0',   // منتظر تمام درخواست‌های شبکه
                timeout: 30000
                });

                // چند ثانیه صبر اضافی برای بارگذاری کامل جاوااسکریپت‌های سنگین
                await new Promise(r => setTimeout(r, 3000));

                // گرفتن اسکرین‌شات برای دیباگ (در صورت نیاز)
                await page.screenshot({ path: 'page_loaded.png' });
                console.log('Screenshot saved as page_loaded.png (for debugging).');

                // پیدا کردن فیلد ورودی به روش‌های مختلف
                let inputHandle = null;
                console.log('Looking for input field...');

                // روش ۱: هر input که hidden نباشد
                try {
                inputHandle = await page.waitForSelector('input:not([type="hidden"])', { visible: true, timeout: 15000 });
                console.log('Found input via standard CSS selector.');
                } catch (e) {
                // ادامه بده
                }

                // روش ۲: اگر روش اول جواب نداد، کلیک روی صفحه و دوباره تلاش کن
                if (!inputHandle) {
                console.log('No visible input found. Clicking on the page to maybe reveal it...');
                await page.mouse.click(300, 300);   // کلیک وسط صفحه
                await new Promise(r => setTimeout(r, 2000));
                try {
                    inputHandle = await page.waitForSelector('input:not([type="hidden"])', { visible: true, timeout: 10000 });
                } catch (e) {}
                }

                // روش ۳: جستجو با XPath (textarea یا input)
                if (!inputHandle) {
                console.log('Trying XPath for input or textarea...');
                try {
                    inputHandle = await page.waitForXPath(
                    '//input | //textarea',
                    { visible: true, timeout: 10000 }
                    );
                } catch (e) {}
                }

                if (!inputHandle) {
                // آخرین تلاش: گرفتن اسکرین‌شات و خطا
                await page.screenshot({ path: 'input_not_found.png' });
                throw new Error('Could not find any input field on the page. Check input_not_found.png.');
                }

                await inputHandle.type(telegramLink);
                console.log('Pasted the link.');

                // کلیک روی دکمهٔ «Download» با الگوهای مقاوم
                const firstBtnClicked = await clickWhenAnyXPath(page, [
                "//button[contains(text(), 'Download')]",
                "//input[@type='submit'][contains(@value, 'Download')]",
                "//button[contains(@class, 'download')]",
                "//a[contains(text(), 'Download')]",
                "//form//button",
                "//form//input[@type='submit']",
                ], 15000);

                if (!firstBtnClicked) {
                throw new Error('Could not find or click the first "Download" button.');
                }

                // منتظر ظاهر شدن دکمهٔ «Get Direct Download Link»
                console.log('Waiting for "Get Direct Download Link"...');
                const directBtnClicked = await clickWhenAnyXPath(page, [
                "//button[contains(text(), 'Get Direct')]",
                "//a[contains(text(), 'Get Direct')]",
                "//button[contains(text(), 'Direct Download')]",
                "//a[contains(text(), 'Direct Download')]",
                "//*[contains(text(), 'Get Direct') and (self::button or self::a)]",
                ], 20000);

                if (!directBtnClicked) {
                throw new Error('"Get Direct Download Link" button not found.');
                }

                // صبر برای پیمایش (redirect) به صفحه تایمر
                await page.waitForNavigation({ waitUntil: 'networkidle0', timeout: 15000 }).catch(() => {
                console.log('Navigation may have occurred instantly.');
                });
                console.log('Current URL after direct link click:', page.url());

                // یافتن دکمه نهایی یا پیمایش خودکار به دامنه tg
                let downloadUrl = page.url();
                if (downloadUrl.includes('tg.telegramdownloader.net')) {
                console.log('Already on final download page, no need to click.');
                } else {
                console.log('Looking for final "Download Link" button...');
                const finalClicked = await clickWhenAnyXPath(page, [
                    "//a[contains(text(), 'Download Link')]",
                    "//button[contains(text(), 'Download Link')]",
                    "//*[contains(text(), 'Download Link') and (self::a or self::button)]",
                    "//a[contains(@href, 'tg.telegramdownloader.net')]",
                ], 20000);

                if (!finalClicked) {
                    console.log('Button not found, waiting for navigation to tg.telegramdownloader.net...');
                    await page.waitForNavigation({ waitUntil: 'networkidle0', timeout: 30000 }).catch(() => {});
                }
                downloadUrl = page.url();
                }

                console.log('Final download URL:', downloadUrl);
                if (!downloadUrl.includes('tg.telegramdownloader.net')) {
                throw new Error('Did not reach the expected download domain. Got: ' + downloadUrl);
                }

                await browser.close();
                console.log('Browser closed.');

                // دانلود فایل (مانند قبل)
                // ... (کد دانلود، ذخیره و تقسیم، بدون تغییر)
                // توجه: برای اختصار، همان کد قبلی از «Starting file download...» تا انتها را کپی/پیست کنید.
                // کد کامل را در فایل workflow قرار دهید.

            } catch (err) {
                console.error('Script error:', err);
                await browser.close();
                process.exit(1);
            }
            })();
          SCRIPT_EOF

      - name: Run download script
        env:
          LINK: ${{ github.event.inputs.telegram_link }}
        run: node download.js "$LINK"

      - name: Commit and push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Downloads
          git add Downloads/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add downloaded file/parts"
            git push
            echo "Files pushed to repository."
          fi