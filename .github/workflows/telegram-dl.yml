name: Download Telegram File and Split

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: 'لینک عمومی پست تلگرام (مثلاً https://t.me/c/123/45)'
        required: true

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Create download script
        run: |
          cat << 'SCRIPT_EOF' > download.js
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          // تابع کمکی: پیدا کردن و کلیک روی یک المنت با XPath (با استفاده از ::-p-xpath)
          async function clickXPath(page, xpath, timeoutMs = 10000) {
            const start = Date.now();
            while (Date.now() - start < timeoutMs) {
              const element = await page.$(`::-p-xpath(${xpath})`);
              if (element) {
                await element.click();
                console.log(`Clicked: ${xpath}`);
                return true;
              }
              await new Promise(r => setTimeout(r, 500));
            }
            return false;
          }

          (async () => {
            const telegramLink = process.argv[2];
            if (!telegramLink) {
              console.error('No Telegram link provided');
              process.exit(1);
            }

            console.log('Launching browser...');
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            try {
              const page = await browser.newPage();
              await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');

              console.log('Navigating to telegramdownloader.net...');
              await page.goto('https://telegramdownloader.net/', {
                waitUntil: 'networkidle0',
                timeout: 30000
              });

              // صبر برای بارگذاری کامل
              await new Promise(r => setTimeout(r, 3000));
              await page.screenshot({ path: 'page_loaded.png' });
              console.log('Screenshot saved: page_loaded.png');

              // پر کردن فیلد ورودی با ID اختصاصی
              console.log('Waiting for input field #ts-telegram-link...');
              await page.waitForSelector('#ts-telegram-link', { visible: true, timeout: 15000 });
              await page.type('#ts-telegram-link', telegramLink);
              console.log('Link pasted.');

              // زدن Enter برای ارسال فرم (بدون نیاز به کلیک دکمه)
              console.log('Pressing Enter...');
              await page.keyboard.press('Enter');

              // صبر برای ظاهر شدن لینک «Get Direct Download Link»
              console.log('Waiting for "Get Direct Download Link"...');
              const getDirectXPath = "//a[contains(text(), 'Get Direct Download Link')]";
              const clicked = await clickXPath(page, getDirectXPath, 20000);
              if (!clicked) {
                await page.screenshot({ path: 'getdirect_not_found.png' });
                throw new Error('"Get Direct Download Link" button not found.');
              }

              // صبر برای پیمایش به صفحه‌ی تایمر
              await page.waitForNavigation({ waitUntil: 'networkidle0', timeout: 15000 }).catch(() => {
                console.log('Navigation might have been instant.');
              });
              console.log('Current URL:', page.url());

              // صبر برای ظاهر شدن دکمه‌ی نهایی «Download File» با ID=download-btn
              console.log('Waiting for final download button (#download-btn)...');
              await page.waitForSelector('#download-btn', { visible: true, timeout: 25000 });
              console.log('Final button found, clicking...');
              await page.click('#download-btn');

              // صبر برای انتقال به دامنه‌ی tg.telegramdownloader.net
              await page.waitForNavigation({ waitUntil: 'networkidle0', timeout: 30000 }).catch(() => {});
              const downloadUrl = page.url();
              console.log('Final download URL:', downloadUrl);
              if (!downloadUrl.includes('tg.telegramdownloader.net')) {
                throw new Error('Unexpected final domain: ' + downloadUrl);
              }

              await browser.close();
              console.log('Browser closed.');

              // دانلود فایل با fetch
              console.log('Starting file download...');
              const res = await fetch(downloadUrl, { redirect: 'follow' });
              if (!res.ok) throw new Error(`Download failed: ${res.status}`);

              // تشخیص نام فایل
              const disposition = res.headers.get('content-disposition');
              let filename = 'telegram_file';
              if (disposition) {
                const match = disposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                if (match && match[1]) filename = match[1].replace(/['"]/g, '');
              } else {
                const urlPath = new URL(downloadUrl).pathname;
                const base = path.basename(urlPath);
                if (base && base.length < 200) filename = base;
              }
              console.log('Saving as:', filename);

              const fileStream = fs.createWriteStream(filename);
              const reader = res.body.getReader();
              await new Promise((resolve, reject) => {
                function pump() {
                  reader.read().then(({ done, value }) => {
                    if (done) { fileStream.end(); resolve(); }
                    else { fileStream.write(value); pump(); }
                  }).catch(reject);
                }
                pump();
              });
              console.log('File saved.');

              // مدیریت حجم و تقسیم
              const stats = fs.statSync(filename);
              const maxSize = 45 * 1024 * 1024; // 45MB
              const downloadsDir = 'Downloads';
              if (!fs.existsSync(downloadsDir)) fs.mkdirSync(downloadsDir, { recursive: true });

              if (stats.size > maxSize) {
                console.log(`File size ${(stats.size/1024/1024).toFixed(2)} MB > 45 MB. Splitting...`);
                const partPrefix = path.join(downloadsDir, 'part_');
                execSync(`split -b 45M -d "${filename}" "${partPrefix}"`, { stdio: 'inherit' });
                fs.unlinkSync(filename);
                fs.writeFileSync(path.join(downloadsDir, 'original_name.txt'), filename);
                console.log('Split completed.');
              } else {
                console.log('Moving file to Downloads folder.');
                fs.renameSync(filename, path.join(downloadsDir, filename));
              }

              console.log('Done.');
            } catch (err) {
              console.error('Script error:', err);
              await browser.close();
              process.exit(1);
            }
          })();
          SCRIPT_EOF

      - name: Run download script
        env:
          LINK: ${{ github.event.inputs.telegram_link }}
        run: node download.js "$LINK"

      - name: Commit and push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Downloads
          git add Downloads/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add downloaded file/parts"
            git push
            echo "Files pushed to repository."
          fi