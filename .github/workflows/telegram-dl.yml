name: Download Telegram File and Split

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: 'لینک عمومی پست تلگرام (مثلاً https://t.me/c/123/45)'
        required: true

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Create download script
        run: |
          cat << 'SCRIPT_EOF' > download.js
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          (async () => {
            const telegramLink = process.argv[2];
            if (!telegramLink) {
              console.error('No Telegram link provided');
              process.exit(1);
            }

            console.log('Launching browser...');
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            try {
              // ---------- مرحله ۱: صفحه اصلی ----------
              const mainPage = await browser.newPage();
              await mainPage.setUserAgent(
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              );

              console.log('Navigating to telegramdownloader.net...');
              await mainPage.goto('https://telegramdownloader.net/', {
                waitUntil: 'networkidle0',
                timeout: 30000
              });

              // پر کردن فیلد لینک
              console.log('Typing Telegram link...');
              await mainPage.waitForSelector('#ts-telegram-link', { visible: true, timeout: 15000 });
              await mainPage.type('#ts-telegram-link', telegramLink);

              // کلیک روی دکمه Download (آبی رنگ اول)
              console.log('Clicking "Download" button...');
              await mainPage.waitForSelector('#ts-download-btn', { visible: true, timeout: 10000 });
              await mainPage.click('#ts-download-btn');

              // صبر برای ظاهر شدن دکمه «Get Direct Download Link»
              console.log('Waiting for "Get Direct Download Link" button...');
              const getDirectSelector = 'a.ts-download-link-button';
              await mainPage.waitForSelector(getDirectSelector, { visible: true, timeout: 25000 });
              console.log('"Get Direct Download Link" button appeared.');

              // ذخیره target اصلی برای تشخیص تب جدید
              const mainPageTarget = mainPage.target();

              // کلیک روی «Get Direct Download Link» (باز شدن در تب جدید)
              await mainPage.click(getDirectSelector);

              // گرفتن تب جدید (صفحه تایمر)
              console.log('Waiting for the timer page (new tab)...');
              const timerTarget = await browser.waitForTarget(
                target => target.opener() === mainPageTarget,
                { timeout: 15000 }
              );
              const timerPage = await timerTarget.page();
              await timerPage.setUserAgent(mainPage._client._sessionId ? mainPage._client._sessionId : null); // not needed
              await timerPage.bringToFront();
              await timerPage.waitForLoadState('networkidle0', { timeout: 15000 });
              console.log('Timer page URL:', timerPage.url());

              // ---------- مرحله ۲: صفحه تایمر (منتظر دکمه Download File) ----------
              console.log('Waiting for final "Download File" button...');
              await timerPage.waitForSelector('#download-btn', { visible: true, timeout: 30000 });
              console.log('"Download File" button found, clicking...');

              // ذخیره target صفحه تایمر برای تشخیص تب نهایی
              const timerTargetObj = timerPage.target();

              // کلیک روی Download File (باز شدن تب نهایی با لینک مستقیم)
              await timerPage.click('#download-btn');

              // گرفتن تب نهایی (tg.telegramdownloader.net)
              console.log('Waiting for final download page...');
              const finalTarget = await browser.waitForTarget(
                target => target.opener() === timerTargetObj,
                { timeout: 15000 }
              );
              const finalPage = await finalTarget.page();
              await finalPage.bringToFront();
              await finalPage.waitForLoadState('networkidle0', { timeout: 15000 });
              const downloadUrl = finalPage.url();
              console.log('Final download URL:', downloadUrl);

              if (!downloadUrl.includes('tg.telegramdownloader.net')) {
                throw new Error('Unexpected final domain: ' + downloadUrl);
              }

              // می‌توانیم مرورگر را ببندیم
              await browser.close();
              console.log('Browser closed.');

              // ---------- دانلود فایل با fetch ----------
              console.log('Downloading file...');
              const res = await fetch(downloadUrl, { redirect: 'follow' });
              if (!res.ok) throw new Error(`Download failed with status ${res.status}`);

              const disposition = res.headers.get('content-disposition');
              let filename = 'telegram_file';
              if (disposition) {
                const match = disposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                if (match && match[1]) filename = match[1].replace(/['"]/g, '');
              } else {
                const urlPath = new URL(downloadUrl).pathname;
                const base = path.basename(urlPath);
                if (base && base.length < 200) filename = base;
              }
              console.log('Saving as:', filename);

              // ذخیره فایل
              const fileStream = fs.createWriteStream(filename);
              const reader = res.body.getReader();
              await new Promise((resolve, reject) => {
                function pump() {
                  reader.read().then(({ done, value }) => {
                    if (done) { fileStream.end(); resolve(); }
                    else { fileStream.write(value); pump(); }
                  }).catch(reject);
                }
                pump();
              });
              console.log('File saved.');

              // تقسیم فایل و انتقال به پوشه Downloads
              const stats = fs.statSync(filename);
              const maxSize = 45 * 1024 * 1024; // 45 مگابایت
              const downloadsDir = 'Downloads';
              if (!fs.existsSync(downloadsDir)) fs.mkdirSync(downloadsDir, { recursive: true });

              if (stats.size > maxSize) {
                console.log(`File size ${(stats.size/1024/1024).toFixed(2)} MB > 45 MB. Splitting...`);
                const partPrefix = path.join(downloadsDir, 'part_');
                execSync(`split -b 45M -d "${filename}" "${partPrefix}"`, { stdio: 'inherit' });
                fs.unlinkSync(filename); // حذف فایل اصلی
                fs.writeFileSync(path.join(downloadsDir, 'original_name.txt'), filename);
                console.log('Split completed.');
              } else {
                console.log('Moving file to Downloads folder.');
                fs.renameSync(filename, path.join(downloadsDir, filename));
              }

              console.log('Done.');
            } catch (err) {
              console.error('Script error:', err);
              await browser.close();
              process.exit(1);
            }
          })();
          SCRIPT_EOF

      - name: Run download script
        env:
          LINK: ${{ github.event.inputs.telegram_link }}
        run: node download.js "$LINK"

      - name: Commit and push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Downloads
          git add Downloads/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add downloaded file/parts"
            git push
            echo "Files pushed to repository."
          fi