name: Download Telegram File and Split

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: 'لینک عمومی پست تلگرام (مثلاً https://t.me/c/123/45)'
        required: true

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Create download script
        run: |
          cat << 'SCRIPT_EOF' > download.js
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          (async () => {
            const telegramLink = process.argv[2];
            if (!telegramLink) {
              console.error('No Telegram link provided');
              process.exit(1);
            }

            console.log('Launching browser...');
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            try {
              const page = await browser.newPage();
              await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');

              console.log('Navigating to telegramdownloader.net...');
              await page.goto('https://telegramdownloader.net/', { waitUntil: 'networkidle2', timeout: 30000 });

              await page.waitForSelector('input[type="text"]', { timeout: 10000 });
              await page.type('input[type="text"]', telegramLink);
              console.log('Pasted the link.');

              const downloadButton = await page.waitForSelector('button:has-text("Download"), input[type="submit"][value*="Download"]', { timeout: 5000 });
              await downloadButton.click();
              console.log('Clicked initial Download button.');

              const getDirectBtn = await page.waitForSelector('button:has-text("Get Direct Download Link"), a:has-text("Get Direct Download Link")', { timeout: 15000 });
              console.log('"Get Direct Download Link" button appeared.');
              await getDirectBtn.click();

              await page.waitForNavigation({ waitUntil: 'networkidle2', timeout: 15000 });
              console.log('Arrived at timer page.');

              const finalButton = await page.waitForSelector('a:has-text("Download Link"), button:has-text("Download Link")', { timeout: 20000 });
              console.log('Final "Download Link" button found.');

              const [response] = await Promise.all([
                page.waitForNavigation({ waitUntil: 'networkidle2', timeout: 30000 }),
                finalButton.click()
              ]);
              const downloadUrl = page.url();
              console.log('Download URL obtained:', downloadUrl);

              await browser.close();
              console.log('Browser closed.');

              console.log('Starting file download...');
              const res = await fetch(downloadUrl, { redirect: 'follow' });
              if (!res.ok) {
                throw new Error(`Failed to download file: ${res.status} ${res.statusText}`);
              }

              const disposition = res.headers.get('content-disposition');
              let filename = 'telegram_file';
              if (disposition) {
                const match = disposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                if (match && match[1]) {
                  filename = match[1].replace(/['"]/g, '');
                }
              } else {
                const urlPath = new URL(downloadUrl).pathname;
                const basename = path.basename(urlPath);
                if (basename && basename.length < 200) {
                  filename = basename;
                }
              }
              console.log('Saving as:', filename);

              const fileStream = fs.createWriteStream(filename);
              const reader = res.body.getReader();
              await new Promise((resolve, reject) => {
                function pump() {
                  reader.read().then(({ done, value }) => {
                    if (done) {
                      fileStream.end();
                      resolve();
                      return;
                    }
                    fileStream.write(value);
                    pump();
                  }).catch(reject);
                }
                pump();
              });
              console.log('File saved.');

              const stats = fs.statSync(filename);
              const maxSize = 45 * 1024 * 1024;
              const downloadsDir = 'Downloads';
              if (!fs.existsSync(downloadsDir)) {
                fs.mkdirSync(downloadsDir, { recursive: true });
              }

              if (stats.size > maxSize) {
                console.log(`File size ${(stats.size/(1024*1024)).toFixed(2)} MB exceeds 45 MB. Splitting...`);
                const partPrefix = path.join(downloadsDir, 'part_');
                execSync(`split -b 45M -d "${filename}" "${partPrefix}"`, { stdio: 'inherit' });
                fs.unlinkSync(filename);
                fs.writeFileSync(path.join(downloadsDir, 'original_name.txt'), filename);
                console.log('File split into 45 MB parts.');
              } else {
                console.log('File is under 45 MB, moving to Downloads folder.');
                fs.renameSync(filename, path.join(downloadsDir, filename));
              }

              console.log('Done.');
            } catch (err) {
              console.error('Script error:', err);
              await browser.close();
              process.exit(1);
            }
          })();
          SCRIPT_EOF

      - name: Run download script
        env:
          LINK: ${{ github.event.inputs.telegram_link }}
        run: node download.js "$LINK"

      - name: Commit and push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Downloads
          git add Downloads/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add downloaded file/parts"
            git push
            echo "Files pushed to repository."
          fi