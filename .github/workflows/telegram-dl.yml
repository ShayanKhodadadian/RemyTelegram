name: Download Telegram Files & Archive

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: "Single Telegram public link (e.g. https://t.me/channelname/123). Leave empty if using range."
        required: false
      start_link:
        description: "Start link for range download (e.g. https://t.me/channelname/2994). Must be same channel as end link."
        required: false
      end_link:
        description: "End link for range download (e.g. https://t.me/channelname/3000). Must be same channel as start link."
        required: false

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (Chrome, zip)
        run: |
          # Chrome
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          # zip utility
          sudo apt-get install -y zip

      - name: Install npm packages
        run: npm install puppeteer-core puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Create download & archive script
        run: |
          cat > download.js << 'EOF'
          const puppeteer = require("puppeteer-extra");
          const StealthPlugin = require("puppeteer-extra-plugin-stealth");
          const fs   = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");
          const https = require("https");
          const http = require("http");

          puppeteer.use(StealthPlugin());

          // ─── Helpers ────────────────────────────────────────────────────────────

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          async function screenshot(page, dir, name) {
            const p = path.join(dir, name);
            try { await page.screenshot({ path: p, fullPage: true }); } catch (_) {}
            console.log(`Screenshot saved: ${p}`);
          }

          async function pollPage(page, fn, desc, intervalMs = 1000, timeoutMs = 60000) {
            console.log(`Polling: ${desc} ...`);
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              try {
                const val = await page.evaluate(fn);
                if (val) { console.log(`  ✓ ${desc}: ${val}`); return val; }
              } catch (_) {}
              await sleep(intervalMs);
            }
            throw new Error(`Timed out waiting for: ${desc}`);
          }

          async function directDownload(downloadURL, destination, cookies, userAgent, referer) {
            const urlObj = new URL(downloadURL);
            const mod = urlObj.protocol === "https:" ? https : http;

            const cookieHeader = cookies.map(c => `${c.name}=${c.value}`).join("; ");

            const options = {
              method: "GET",
              headers: {
                "User-Agent": userAgent,
                "Referer": referer,
                "Cookie": cookieHeader,
                "Accept": "*/*",
              },
            };

            return new Promise((resolve, reject) => {
              const req = mod.get(urlObj.href, options, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  return directDownload(res.headers.location, destination, cookies, userAgent, referer)
                    .then(resolve)
                    .catch(reject);
                }
                if (res.statusCode !== 200) {
                  return reject(new Error(`Download failed with status ${res.statusCode}`));
                }
                const fileStream = fs.createWriteStream(destination);
                res.pipe(fileStream);
                fileStream.on("finish", () => { fileStream.close(); resolve(); });
                fileStream.on("error", reject);
                res.on("error", reject);
              });
              req.on("error", reject);
              req.end();
            });
          }

          function parseTelegramLink(link) {
            const match = link.match(/^https?:\/\/t\.me\/([^\/]+)\/(\d+)$/);
            if (!match) throw new Error(`Invalid Telegram link: ${link}`);
            return { channel: match[1], messageId: parseInt(match[2], 10) };
          }

          /**
           * Create a zip archive (with optional splitting) and a README.md
           * for a downloaded file. Everything is placed inside a subfolder
           * of the main output directory.
           */
          function packageFile(rawFilePath, outputBaseDir, repoInfo) {
            const { owner, repo, branch } = repoInfo;
            const fileSize = fs.statSync(rawFilePath).size;
            const originalName = path.basename(rawFilePath);
            // Folder name = original filename without extension (unique per message)
            const ext = path.extname(originalName);
            const folderName = originalName.slice(0, -ext.length) || originalName;

            const folderPath = path.join(outputBaseDir, folderName);
            if (!fs.existsSync(folderPath)) fs.mkdirSync(folderPath, { recursive: true });

            const archiveBase = path.join(folderPath, folderName); // without extension, zip will add .zip
            const SPLIT_THRESHOLD_MB = 95;
            const SPLIT_THRESHOLD_BYTES = SPLIT_THRESHOLD_MB * 1024 * 1024;

            // Build zip command
            let cmd;
            if (fileSize > SPLIT_THRESHOLD_BYTES) {
              console.log(`  File > ${SPLIT_THRESHOLD_MB} MB — creating split archive.`);
              cmd = `zip -j -s ${SPLIT_THRESHOLD_MB}m "${archiveBase}.zip" "${rawFilePath}"`;
            } else {
              cmd = `zip -j "${archiveBase}.zip" "${rawFilePath}"`;
            }
            execSync(cmd, { stdio: 'pipe' });

            // Remove the raw file
            fs.unlinkSync(rawFilePath);

            // Gather all parts
            const partFiles = fs.readdirSync(folderPath)
              .filter(f => f.endsWith('.zip') || f.match(/\.z\d{2,3}$/))
              .sort();

            // Generate README
            const partsCount = partFiles.length;
            let totalSize = 0;
            let downloadLinksMD = "";
            let idx = 0;
            for (const part of partFiles) {
              const partPath = path.join(folderPath, part);
              const pSize = fs.statSync(partPath).size;
              totalSize += pSize;
              idx++;
              const encodedFolder = encodeURIComponent(folderName);
              const encodedPart = encodeURIComponent(part);
              const rawUrl = `https://github.com/${owner}/${repo}/raw/${branch}/Downloads/${encodedFolder}/${encodedPart}`;
              downloadLinksMD += `| ${idx} | \`${part}\` | [Download](${rawUrl}) |\n`;
            }

            const totalSizeMB = (totalSize / (1024 * 1024)).toFixed(2);
            const readmeContent = [
              `# ${folderName}`,
              ``,
              `---`,
              ``,
              `## Download Information`,
              ``,
              `| Property | Value |`,
              `|----------|-------|`,
              `| **Original File** | \`${originalName}\` |`,
              partsCount > 1
                ? `| **Total Size** | **${partsCount} parts** – **${totalSizeMB} MB** |`
                : `| **Size** | ${totalSizeMB} MB |`,
              `| **Status** | **Complete (100%)** |`,
              ``,
              `---`,
              ``,
              `## Download Links`,
              ``,
              `| # | File | Link |`,
              `|---|------|------|`,
              downloadLinksMD.trimEnd(),
              ``,
              `---`,
              ``,
              `## How to Extract`,
              ``,
              `1. **Download all parts** (if split) – parts are \`.zip\`, \`.z01\`, \`.z02\`...`,
              `2. **Open** \`${folderName}.zip\` with WinRAR, 7-Zip, Ark, or any standard zip tool`,
              `3. **Extract** – all parts combine automatically`,
              ``,
              `---`,
              ``,
              `*Created by [avasam.ir](https://avasam.ir) Telegram Downloader*`
            ].join('\n');

            fs.writeFileSync(path.join(folderPath, 'README.md'), readmeContent, 'utf8');
            console.log(`  ✓ Archive created in: ${folderPath}`);
          }

          // ─── Core download logic for one link ─────────────────────────────────────

          async function processOneLink(link, browser, UA, downloadsDir, repoInfo) {
            console.log(`\n--- Processing: ${link} ---`);
            let page1, page2;
            try {
              page1 = await browser.newPage();
              page2 = await browser.newPage();

              async function setupPage(pg) {
                await pg.setUserAgent(UA);
                await pg.setViewport({ width: 1366, height: 768 });
                pg.setDefaultTimeout(90000);
                await pg.evaluateOnNewDocument(() => {
                  Object.defineProperty(navigator, "webdriver", { get: () => false });
                });
              }

              await setupPage(page1);
              await setupPage(page2);

              // Step 1‑3: Get intermediate URL
              await page1.goto("https://telegramdownloader.net/", {
                waitUntil: "domcontentloaded", timeout: 90000
              });
              await sleep(4000);
              await page1.waitForSelector("#ts-telegram-link", { timeout: 30000 });
              await page1.evaluate(() => (document.querySelector("#ts-telegram-link").value = ""));
              await page1.type("#ts-telegram-link", link, { delay: 60 });
              await page1.waitForSelector("#ts-download-btn", { timeout: 15000 });
              await page1.click("#ts-download-btn");

              const intermediateURL = await pollPage(
                page1,
                () => {
                  const btn = document.querySelector(".ts-download-link-button:not(#download-btn)");
                  return btn && btn.href ? btn.href : null;
                },
                "Get Direct Download Link href", 1000, 60000
              );
              await page1.close();

              // Step 4‑5: Get final download URL
              await page2.goto(intermediateURL, {
                waitUntil: "domcontentloaded", timeout: 60000
              });
              await sleep(2000);
              const downloadURL = await pollPage(
                page2,
                () => {
                  const btn = document.querySelector("#download-btn");
                  if (!btn) return null;
                  const h = btn.getAttribute("href") || "";
                  return h.startsWith("http") ? h : null;
                },
                "#download-btn href", 1000, 90000
              );

              // Step 6: Direct download
              const cookies = await page2.cookies();
              const urlObj = new URL(downloadURL);
              let originalName = path.basename(urlObj.pathname);
              originalName = decodeURIComponent(originalName).replace(/[^a-zA-Z0-9._-]/g, "_") || "file";
              const { messageId } = parseTelegramLink(link);
              const filename = `${messageId}_${originalName}`;
              const rawDestPath = path.join(downloadsDir, filename); // temporary raw file

              await directDownload(downloadURL, rawDestPath, cookies, UA, intermediateURL);
              const stat = fs.statSync(rawDestPath);
              if (stat.size === 0) throw new Error("Downloaded file is empty.");
              console.log(`  ✓ Raw file saved: ${filename} (${(stat.size/1024/1024).toFixed(2)} MB)`);

              // Package into folder + zip + README
              packageFile(rawDestPath, downloadsDir, repoInfo);

              await page2.close();
              return true; // success

            } catch (err) {
              console.error(`  ✗ Failed for ${link}:`, err.message);
              // Cleanup open pages
              try { if (page1) await page1.close(); } catch (_) {}
              try { if (page2) await page2.close(); } catch (_) {}
              return false;
            }
          }

          // ─── Main ────────────────────────────────────────────────────────────────

          (async () => {
            const args = process.argv.slice(2);
            const mode = args[0];
            if (!mode || (mode !== "--single" && mode !== "--range")) {
              console.error("Usage: node download.js --single <link>   OR   --range <start_link> <end_link>");
              process.exit(1);
            }

            const downloadsDir = path.resolve("Downloads");
            if (!fs.existsSync(downloadsDir)) fs.mkdirSync(downloadsDir, { recursive: true });

            // Repo info for README links (from environment)
            const repoOwner = process.env.REPO_OWNER || "unknown";
            const repoName = process.env.REPO_NAME || "unknown";
            const branch = process.env.BRANCH || "main";
            const repoInfo = { owner: repoOwner, repo: repoName, branch: branch };

            const browser = await puppeteer.launch({
              headless: true,
              executablePath: "/usr/bin/google-chrome",
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-blink-features=AutomationControlled",
                "--disable-dev-shm-usage",
                "--window-size=1366,768"
              ]
            });

            const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36";

            try {
              if (mode === "--single") {
                const link = args[1];
                if (!link) throw new Error("No link provided for single mode.");
                const ok = await processOneLink(link, browser, UA, downloadsDir, repoInfo);
                if (!ok) process.exit(1);
                console.log("\n══════════════════════════════════════════");
                console.log(" All done! ✓");
                console.log("══════════════════════════════════════════");
              } else {
                const startLink = args[1];
                const endLink = args[2];
                if (!startLink || !endLink) throw new Error("Both start and end links required.");

                const start = parseTelegramLink(startLink);
                const end = parseTelegramLink(endLink);
                if (start.channel !== end.channel)
                  throw new Error("Start and end links must be from the same channel.");

                const minId = Math.min(start.messageId, end.messageId);
                const maxId = Math.max(start.messageId, end.messageId);

                console.log(`\n--- Range download: ${start.channel} messages ${minId} → ${maxId} ---`);
                let success = 0;
                for (let id = minId; id <= maxId; id++) {
                  const link = `https://t.me/${start.channel}/${id}`;
                  const ok = await processOneLink(link, browser, UA, downloadsDir, repoInfo);
                  if (ok) success++;
                  await sleep(2000); // polite pause
                }
                console.log(`\n══════════════════════════════════════════`);
                console.log(` Range complete: ${success} of ${maxId - minId + 1} files downloaded.`);
                console.log(`══════════════════════════════════════════`);
              }
            } catch (err) {
              console.error("\n✗ Fatal error:", err.message);
              await browser.close();
              process.exit(1);
            }

            await browser.close();
          })();
          EOF

      - name: Run download script
        env:
          SINGLE_LINK: ${{ github.event.inputs.telegram_link }}
          START_LINK: ${{ github.event.inputs.start_link }}
          END_LINK: ${{ github.event.inputs.end_link }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$START_LINK" ] && [ -n "$END_LINK" ]; then
            echo "Mode: range"
            node download.js --range "$START_LINK" "$END_LINK"
          elif [ -n "$SINGLE_LINK" ]; then
            echo "Mode: single"
            node download.js --single "$SINGLE_LINK"
          else
            echo "Error: You must provide either a single link or both start and end links."
            exit 1
          fi

      - name: Commit and push files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d Downloads ] && [ "$(ls -A Downloads)" ]; then
            git add Downloads/
            if git diff --cached --quiet; then
              echo "Nothing new to commit."
            else
              git commit -m "Add downloaded Telegram file(s) (archived per file)"
              git push
            fi
          else
            echo "Downloads folder is empty — nothing to commit."
          fi

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: Downloads/debug_*.png
          if-no-files-found: ignore