name: Download Telegram File and Split

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: "Telegram public link (e.g. https://t.me/channelname/123)"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Install npm packages
        run: npm install puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Create download script
        run: |
          cat > download.js << 'EOF'
          const puppeteer = require("puppeteer-extra");
          const StealthPlugin = require("puppeteer-extra-plugin-stealth");
          const fs   = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          puppeteer.use(StealthPlugin());

          // ─── Helpers ────────────────────────────────────────────────────────────

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          async function screenshot(page, dir, name) {
            const p = path.join(dir, name);
            try { await page.screenshot({ path: p, fullPage: true }); } catch (_) {}
            console.log(`Screenshot saved: ${p}`);
          }

          // Poll page.evaluate(fn) every intervalMs until it returns truthy, or throw on timeout
          async function pollPage(page, fn, desc, intervalMs = 1000, timeoutMs = 60000) {
            console.log(`Polling: ${desc} ...`);
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              try {
                const val = await page.evaluate(fn);
                if (val) { console.log(`  ✓ ${desc}: ${val}`); return val; }
              } catch (_) {}
              await sleep(intervalMs);
            }
            throw new Error(`Timed out waiting for: ${desc}`);
          }

          // Wait for a fully-written (non-.crdownload) new file to appear in dir
          async function waitForDownload(dir, snapshot, timeoutMs = 180000) {
            console.log("Waiting for downloaded file to appear in Downloads/ ...");
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              const current = fs.readdirSync(dir);
              const newFile = current.find(
                f => !snapshot.includes(f) && !f.endsWith(".crdownload") && !f.endsWith(".tmp")
              );
              if (newFile) {
                // Give it one extra second to finish writing
                await sleep(1500);
                const size = fs.statSync(path.join(dir, newFile)).size;
                if (size > 0) {
                  console.log(`  ✓ File ready: ${newFile} (${(size/1024/1024).toFixed(2)} MB)`);
                  return newFile;
                }
              }
              await sleep(1000);
            }
            throw new Error("Timed out waiting for downloaded file.");
          }

          // ─── Main ────────────────────────────────────────────────────────────────

          (async () => {
            const telegramLink = process.argv[2];
            if (!telegramLink) throw new Error("Usage: node download.js <telegram_link>");

            const downloadsDir = path.resolve("Downloads");
            if (!fs.existsSync(downloadsDir)) fs.mkdirSync(downloadsDir, { recursive: true });

            console.log("\n══════════════════════════════════════════");
            console.log(" Telegram Downloader");
            console.log("══════════════════════════════════════════");
            console.log("Link:", telegramLink);

            const browser = await puppeteer.launch({
              headless: true,
              executablePath: "/usr/bin/google-chrome",
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-blink-features=AutomationControlled",
                "--disable-dev-shm-usage",
                "--window-size=1366,768"
              ]
            });

            const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 " +
                       "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36";

            // Helper: set up a page with stealth UA and viewport
            async function setupPage(pg) {
              await pg.setUserAgent(UA);
              await pg.setViewport({ width: 1366, height: 768 });
              pg.setDefaultTimeout(90000);
              await pg.evaluateOnNewDocument(() => {
                Object.defineProperty(navigator, "webdriver", { get: () => false });
              });
            }

            try {
              // ══════════════════════════════════════════════════════════════════
              // STEP 1 — Open the site and enter the Telegram link
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 1] Opening telegramdownloader.net ...");
              const page1 = await browser.newPage();
              await setupPage(page1);

              await page1.goto("https://telegramdownloader.net/", {
                waitUntil: "domcontentloaded",
                timeout: 90000
              });
              await sleep(4000); // Let JS finish rendering

              // Type into #ts-telegram-link
              await page1.waitForSelector("#ts-telegram-link", { timeout: 30000 });
              await page1.evaluate(() => (document.querySelector("#ts-telegram-link").value = ""));
              await page1.type("#ts-telegram-link", telegramLink, { delay: 60 });
              console.log("  ✓ Link entered");

              // ══════════════════════════════════════════════════════════════════
              // STEP 2 — Click the Download button
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 2] Clicking Download button ...");
              await page1.waitForSelector("#ts-download-btn", { timeout: 15000 });
              await page1.click("#ts-download-btn");

              // ══════════════════════════════════════════════════════════════════
              // STEP 3 — Wait for "Get Direct Download Link" button to appear
              //          NOTE: Both stage-1 and stage-2 buttons share the class
              //          .ts-download-link-button, but only the stage-2 one has
              //          id="download-btn". We want the one WITHOUT that id here.
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 3] Waiting for 'Get Direct Download Link' ...");
              let intermediateURL;
              try {
                intermediateURL = await pollPage(
                  page1,
                  () => {
                    // Select the link button that is NOT the final #download-btn
                    const btn = document.querySelector(
                      ".ts-download-link-button:not(#download-btn)"
                    );
                    return btn && btn.href ? btn.href : null;
                  },
                  "Get Direct Download Link href",
                  1000,
                  60000
                );
              } catch (e) {
                await screenshot(page1, downloadsDir, "debug_step3.png");
                throw new Error("Could not find 'Get Direct Download Link' button: " + e.message);
              }

              // ══════════════════════════════════════════════════════════════════
              // STEP 4 — Navigate to the intermediate page (new tab simulation)
              //          This is the "Your Download is Ready" page with the timer
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 4] Opening download page:", intermediateURL);
              const page2 = await browser.newPage();
              await setupPage(page2);

              // Enable Chrome native downloads to our Downloads folder
              const cdp = await page2.createCDPSession();
              await cdp.send("Page.setDownloadBehavior", {
                behavior: "allow",
                downloadPath: downloadsDir
              });

              await page2.goto(intermediateURL, {
                waitUntil: "domcontentloaded",
                timeout: 60000
              });
              await sleep(2000);

              // ══════════════════════════════════════════════════════════════════
              // STEP 5 — Wait for the 10-second countdown to finish.
              //          Poll until #download-btn has a real https:// href.
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 5] Waiting for countdown + Download File button ...");
              let downloadURL;
              try {
                downloadURL = await pollPage(
                  page2,
                  () => {
                    const btn = document.querySelector("#download-btn");
                    if (!btn) return null;
                    const h = btn.getAttribute("href") || "";
                    return h.startsWith("http") ? h : null;
                  },
                  "#download-btn href",
                  1000,
                  90000  // up to 90 s — covers any countdown length
                );
              } catch (e) {
                await screenshot(page2, downloadsDir, "debug_step5.png");
                throw new Error("Download File button href never became available: " + e.message);
              }

              // ══════════════════════════════════════════════════════════════════
              // STEP 6 — Click "Download File" and let Chrome download natively
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 6] Clicking Download File button ...");
              const snapshot = fs.readdirSync(downloadsDir);

              try {
                await page2.click("#download-btn");
              } catch (clickErr) {
                // If click fails (e.g. blocked by overlay), navigate directly
                console.log("  Click failed, navigating to URL directly:", clickErr.message);
                await page2.goto(downloadURL, { waitUntil: "domcontentloaded", timeout: 60000 });
              }

              // ══════════════════════════════════════════════════════════════════
              // STEP 7 — Wait for the file to fully land in Downloads/
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 7] Waiting for download to complete ...");
              let filename;
              try {
                filename = await waitForDownload(downloadsDir, snapshot, 180000);
              } catch (e) {
                await screenshot(page2, downloadsDir, "debug_step7.png");
                throw e;
              }

              const filePath = path.join(downloadsDir, filename);
              const fileSize = fs.statSync(filePath).size;

              // ══════════════════════════════════════════════════════════════════
              // STEP 8 — Split if > 45 MB, otherwise leave as-is
              // ══════════════════════════════════════════════════════════════════
              const LIMIT = 45 * 1024 * 1024;
              if (fileSize > LIMIT) {
                console.log(`\n[Step 8] File is ${(fileSize/1024/1024).toFixed(2)} MB — splitting into 45 MB parts ...`);
                execSync(`split -b 45M -d "${filePath}" "${filePath}.part_"`);
                fs.unlinkSync(filePath);
                const parts = fs.readdirSync(downloadsDir).filter(f => f.startsWith(filename + ".part_"));
                console.log(`  ✓ Split into ${parts.length} parts:`, parts.join(", "));
              } else {
                console.log(`\n[Step 8] File is ${(fileSize/1024/1024).toFixed(2)} MB — no split needed.`);
              }

              console.log("\n══════════════════════════════════════════");
              console.log(" All done! ✓");
              console.log("══════════════════════════════════════════\n");

            } catch (err) {
              console.error("\n✗ Fatal error:", err.message);
              // Capture screenshot from the most recently active page
              try {
                const pages = await browser.pages();
                const last = pages[pages.length - 1];
                await screenshot(last, downloadsDir, "debug_fatal.png");
              } catch (_) {}
              await browser.close();
              process.exit(1);
            }

            await browser.close();
          })();
          EOF

      - name: Run download script
        env:
          LINK: ${{ github.event.inputs.telegram_link }}
        run: node download.js "$LINK"

      - name: Commit and push files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d Downloads ] && [ "$(ls -A Downloads)" ]; then
            git add Downloads/
            if git diff --cached --quiet; then
              echo "Nothing new to commit."
            else
              git commit -m "Add downloaded Telegram file(s) from ${{ github.event.inputs.telegram_link }}"
              git push
            fi
          else
            echo "Downloads folder is empty — nothing to commit."
          fi

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: Downloads/debug_*.png
          if-no-files-found: ignore