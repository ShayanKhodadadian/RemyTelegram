name: Download Telegram File and Split

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: "Telegram public link (e.g. https://t.me/channelname/123)"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Install npm packages
        run: npm install puppeteer-core puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Create download script
        run: |
          cat > download.js << 'EOF'
          const puppeteer = require("puppeteer-extra");
          const StealthPlugin = require("puppeteer-extra-plugin-stealth");
          const fs   = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");
          const https = require("https");
          const http = require("http");

          puppeteer.use(StealthPlugin());

          // ─── Helpers ────────────────────────────────────────────────────────────

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          async function screenshot(page, dir, name) {
            const p = path.join(dir, name);
            try { await page.screenshot({ path: p, fullPage: true }); } catch (_) {}
            console.log(`Screenshot saved: ${p}`);
          }

          // Poll page.evaluate(fn) every intervalMs until it returns truthy, or throw on timeout
          async function pollPage(page, fn, desc, intervalMs = 1000, timeoutMs = 60000) {
            console.log(`Polling: ${desc} ...`);
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              try {
                const val = await page.evaluate(fn);
                if (val) { console.log(`  ✓ ${desc}: ${val}`); return val; }
              } catch (_) {}
              await sleep(intervalMs);
            }
            throw new Error(`Timed out waiting for: ${desc}`);
          }

          /**
           * Directly download a file using Node's http/https, with session cookies
           * and referer from the current browser context.
           * Handles one level of redirect (can be extended).
           */
          async function directDownload(downloadURL, destination, cookies, userAgent, referer) {
            const urlObj = new URL(downloadURL);
            const mod = urlObj.protocol === "https:" ? https : http;

            const cookieHeader = cookies
              .map(c => `${c.name}=${c.value}`)
              .join("; ");

            const options = {
              method: "GET",
              headers: {
                "User-Agent": userAgent,
                "Referer": referer,
                "Cookie": cookieHeader,
                "Accept": "*/*",
              },
            };

            return new Promise((resolve, reject) => {
              const req = mod.get(urlObj.href, options, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  // Follow redirect (resolve with the final download)
                  return directDownload(res.headers.location, destination, cookies, userAgent, referer)
                    .then(resolve)
                    .catch(reject);
                }
                if (res.statusCode !== 200) {
                  return reject(new Error(`Download failed with status ${res.statusCode}`));
                }
                const fileStream = fs.createWriteStream(destination);
                res.pipe(fileStream);
                fileStream.on("finish", () => {
                  fileStream.close();
                  resolve();
                });
                fileStream.on("error", reject);
                res.on("error", reject);
              });
              req.on("error", reject);
              req.end();
            });
          }

          // ─── Main ────────────────────────────────────────────────────────────────

          (async () => {
            const telegramLink = process.argv[2];
            if (!telegramLink) throw new Error("Usage: node download.js <telegram_link>");

            const downloadsDir = path.resolve("Downloads");
            if (!fs.existsSync(downloadsDir)) fs.mkdirSync(downloadsDir, { recursive: true });

            console.log("\n══════════════════════════════════════════");
            console.log(" Telegram Downloader");
            console.log("══════════════════════════════════════════");
            console.log("Link:", telegramLink);

            const browser = await puppeteer.launch({
              headless: true,
              executablePath: "/usr/bin/google-chrome",
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-blink-features=AutomationControlled",
                "--disable-dev-shm-usage",
                "--window-size=1366,768"
              ]
            });

            const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 " +
                       "(KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36";

            // Helper: set up a page with stealth UA and viewport
            async function setupPage(pg) {
              await pg.setUserAgent(UA);
              await pg.setViewport({ width: 1366, height: 768 });
              pg.setDefaultTimeout(90000);
              await pg.evaluateOnNewDocument(() => {
                Object.defineProperty(navigator, "webdriver", { get: () => false });
              });
            }

            try {
              // ══════════════════════════════════════════════════════════════════
              // STEP 1 — Open the site and enter the Telegram link
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 1] Opening telegramdownloader.net ...");
              const page1 = await browser.newPage();
              await setupPage(page1);

              await page1.goto("https://telegramdownloader.net/", {
                waitUntil: "domcontentloaded",
                timeout: 90000
              });
              await sleep(4000); // Let JS finish rendering

              // Type into #ts-telegram-link
              await page1.waitForSelector("#ts-telegram-link", { timeout: 30000 });
              await page1.evaluate(() => (document.querySelector("#ts-telegram-link").value = ""));
              await page1.type("#ts-telegram-link", telegramLink, { delay: 60 });
              console.log("  ✓ Link entered");

              // ══════════════════════════════════════════════════════════════════
              // STEP 2 — Click the Download button
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 2] Clicking Download button ...");
              await page1.waitForSelector("#ts-download-btn", { timeout: 15000 });
              await page1.click("#ts-download-btn");

              // ══════════════════════════════════════════════════════════════════
              // STEP 3 — Wait for "Get Direct Download Link" button to appear
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 3] Waiting for 'Get Direct Download Link' ...");
              let intermediateURL;
              try {
                intermediateURL = await pollPage(
                  page1,
                  () => {
                    const btn = document.querySelector(
                      ".ts-download-link-button:not(#download-btn)"
                    );
                    return btn && btn.href ? btn.href : null;
                  },
                  "Get Direct Download Link href",
                  1000,
                  60000
                );
              } catch (e) {
                await screenshot(page1, downloadsDir, "debug_step3.png");
                throw new Error("Could not find 'Get Direct Download Link' button: " + e.message);
              }

              // ══════════════════════════════════════════════════════════════════
              // STEP 4 — Navigate to the intermediate page (new tab simulation)
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 4] Opening download page:", intermediateURL);
              const page2 = await browser.newPage();
              await setupPage(page2);

              // We no longer need CDP for downloads because we will use direct Node.js download
              await page2.goto(intermediateURL, {
                waitUntil: "domcontentloaded",
                timeout: 60000
              });
              await sleep(2000);

              // ══════════════════════════════════════════════════════════════════
              // STEP 5 — Wait for the countdown and extract the final download URL
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 5] Waiting for countdown + Download File button ...");
              let downloadURL;
              try {
                downloadURL = await pollPage(
                  page2,
                  () => {
                    const btn = document.querySelector("#download-btn");
                    if (!btn) return null;
                    const h = btn.getAttribute("href") || "";
                    return h.startsWith("http") ? h : null;
                  },
                  "#download-btn href",
                  1000,
                  90000
                );
              } catch (e) {
                await screenshot(page2, downloadsDir, "debug_step5.png");
                throw new Error("Download File button href never became available: " + e.message);
              }

              // ══════════════════════════════════════════════════════════════════
              // STEP 6 — Directly download the file using Node.js (with cookies)
              //           This avoids button‑click issues and browser‑download hangs.
              // ══════════════════════════════════════════════════════════════════
              console.log("\n[Step 6] Downloading file directly via Node.js ...");

              // Gather session cookies from the intermediate page
              const cookies = await page2.cookies();

              // Determine a clean filename from the download URL
              const urlObj = new URL(downloadURL);
              let rawFilename = path.basename(urlObj.pathname);   // e.g. "Grammatik-A2.pdf"
              // Decode any percent-encoding (unlikely but safe)
              rawFilename = decodeURIComponent(rawFilename);
              // Sanitize: keep only safe characters
              const filename = rawFilename.replace(/[^a-zA-Z0-9._-]/g, "_") || "download";
              const destPath = path.join(downloadsDir, filename);

              try {
                await directDownload(
                  downloadURL,
                  destPath,
                  cookies,
                  UA,
                  intermediateURL   // referer = the page where the button appeared
                );
              } catch (err) {
                await screenshot(page2, downloadsDir, "debug_download.png");
                throw new Error("Direct download failed: " + err.message);
              }

              // Verify the file is complete
              const fileStat = fs.statSync(destPath);
              if (fileStat.size === 0) {
                throw new Error("Downloaded file is empty.");
              }
              console.log(`  ✓ Downloaded: ${filename} (${(fileStat.size/1024/1024).toFixed(2)} MB)`);

              // ══════════════════════════════════════════════════════════════════
              // STEP 7 — Split if > 45 MB, otherwise leave as-is
              // ══════════════════════════════════════════════════════════════════
              const LIMIT = 45 * 1024 * 1024;
              if (fileStat.size > LIMIT) {
                console.log(`\n[Step 7] File is ${(fileStat.size/1024/1024).toFixed(2)} MB — splitting into 45 MB parts ...`);
                execSync(`split -b 45M -d "${destPath}" "${destPath}.part_"`);
                fs.unlinkSync(destPath);
                const parts = fs.readdirSync(downloadsDir).filter(f => f.startsWith(filename + ".part_"));
                console.log(`  ✓ Split into ${parts.length} parts:`, parts.join(", "));
              } else {
                console.log(`\n[Step 7] File is ${(fileStat.size/1024/1024).toFixed(2)} MB — no split needed.`);
              }

              console.log("\n══════════════════════════════════════════");
              console.log(" All done! ✓");
              console.log("══════════════════════════════════════════\n");

            } catch (err) {
              console.error("\n✗ Fatal error:", err.message);
              try {
                const pages = await browser.pages();
                const last = pages[pages.length - 1];
                await screenshot(last, downloadsDir, "debug_fatal.png");
              } catch (_) {}
              await browser.close();
              process.exit(1);
            }

            await browser.close();
          })();
          EOF

      - name: Run download script
        env:
          LINK: ${{ github.event.inputs.telegram_link }}
        run: node download.js "$LINK"

      - name: Commit and push files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d Downloads ] && [ "$(ls -A Downloads)" ]; then
            git add Downloads/
            if git diff --cached --quiet; then
              echo "Nothing new to commit."
            else
              git commit -m "Add downloaded Telegram file(s) from ${{ github.event.inputs.telegram_link }}"
              git push
            fi
          else
            echo "Downloads folder is empty — nothing to commit."
          fi

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: Downloads/debug_*.png
          if-no-files-found: ignore