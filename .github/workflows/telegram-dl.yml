name: Download Telegram File and Split

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: 'لینک عمومی پست تلگرام (مثلاً https://t.me/c/123/45)'
        required: true

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Create download script
        run: |
          cat << 'SCRIPT_EOF' > download.js
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          (async () => {
            const telegramLink = process.argv[2];
            if (!telegramLink) {
              console.error('No Telegram link provided');
              process.exit(1);
            }

            console.log('Launching browser...');
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            try {
              const page = await browser.newPage();
              await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36');

              console.log('Navigating to telegramdownloader.net...');
              await page.goto('https://telegramdownloader.net/', {
                waitUntil: 'networkidle0',
                timeout: 30000
              });
              await new Promise(r => setTimeout(r, 3000));

              // پر کردن فیلد
              console.log('Filling input field...');
              await page.waitForSelector('#ts-telegram-link', { visible: true, timeout: 15000 });
              await page.type('#ts-telegram-link', telegramLink);
              console.log('Link pasted.');

              // صبر برای دکمهٔ «Get Direct Download Link» (همون که قبلاً اشتباهی بهش می‌گفتم مرحلهٔ دوم)
              console.log('Waiting for "Get Direct Download Link" button...');
              const getDirectXPath = "//a[contains(text(), 'Get Direct Download Link')]";
              await page.waitForSelector(`xpath/${getDirectXPath}`, { visible: true, timeout: 25000 });
              console.log('Button found, clicking...');
              await page.click(`xpath/${getDirectXPath}`);

              // پیمایش به صفحهٔ تایمر
              await page.waitForNavigation({ waitUntil: 'networkidle0', timeout: 15000 }).catch(() => {});
              console.log('Current URL:', page.url());

              // منتظر دکمهٔ نهایی «Download File» با ID مشخص
              console.log('Waiting for final "Download File" button...');
              await page.waitForSelector('#download-btn', { visible: true, timeout: 25000 });
              await page.click('#download-btn');

              // پیمایش به دامنهٔ دانلود مستقیم
              await page.waitForNavigation({ waitUntil: 'networkidle0', timeout: 30000 }).catch(() => {});
              const downloadUrl = page.url();
              console.log('Final download URL:', downloadUrl);
              if (!downloadUrl.includes('tg.telegramdownloader.net')) {
                throw new Error('Unexpected final domain: ' + downloadUrl);
              }

              await browser.close();
              console.log('Browser closed.');

              // دانلود فایل با fetch
              console.log('Starting file download...');
              const res = await fetch(downloadUrl, { redirect: 'follow' });
              if (!res.ok) throw new Error(`Download failed: ${res.status}`);

              const disposition = res.headers.get('content-disposition');
              let filename = 'telegram_file';
              if (disposition) {
                const match = disposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                if (match && match[1]) filename = match[1].replace(/['"]/g, '');
              } else {
                const urlPath = new URL(downloadUrl).pathname;
                const base = path.basename(urlPath);
                if (base && base.length < 200) filename = base;
              }
              console.log('Saving as:', filename);

              const fileStream = fs.createWriteStream(filename);
              const reader = res.body.getReader();
              await new Promise((resolve, reject) => {
                function pump() {
                  reader.read().then(({ done, value }) => {
                    if (done) { fileStream.end(); resolve(); }
                    else { fileStream.write(value); pump(); }
                  }).catch(reject);
                }
                pump();
              });
              console.log('File saved.');

              // تقسیم در صورت بزرگ‌تر از ۴۵ مگابایت
              const stats = fs.statSync(filename);
              const maxSize = 45 * 1024 * 1024;
              const downloadsDir = 'Downloads';
              if (!fs.existsSync(downloadsDir)) fs.mkdirSync(downloadsDir, { recursive: true });

              if (stats.size > maxSize) {
                console.log(`File size ${(stats.size/1024/1024).toFixed(2)} MB > 45 MB. Splitting...`);
                const partPrefix = path.join(downloadsDir, 'part_');
                execSync(`split -b 45M -d "${filename}" "${partPrefix}"`, { stdio: 'inherit' });
                fs.unlinkSync(filename);
                fs.writeFileSync(path.join(downloadsDir, 'original_name.txt'), filename);
                console.log('Split completed.');
              } else {
                console.log('Moving file to Downloads folder.');
                fs.renameSync(filename, path.join(downloadsDir, filename));
              }

              console.log('Done.');
            } catch (err) {
              console.error('Script error:', err);
              await browser.close();
              process.exit(1);
            }
          })();
          SCRIPT_EOF

      - name: Run download script
        env:
          LINK: ${{ github.event.inputs.telegram_link }}
        run: node download.js "$LINK"

      - name: Commit and push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Downloads
          git add Downloads/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add downloaded file/parts"
            git push
            echo "Files pushed to repository."
          fi